      calendarAttendanceTitle: "日历与出席确认"
      calendarAttendanceBody: "查看每月日程并添加新日程。也可切换至列表，按日、周或月进行查看。<br><br>公开日程并启用出席确认后，其他用户可回答“参加”“考虑中”或“辞退”。主办者可查看回答情况和截止时间。"
      calendarAttendanceLink: "打开日历"
      calendarAttendanceTip1: "可创建跨越多天的日程"
      calendarAttendanceTip2: "可选择日程提醒时间"
      todoListTitle: "待办事项"
      todoListBody: "可添加、完成、编辑和删除待办事项。设置期限和文件夹后，可按创建日期或期限排序查看。"
      todoListLink: "打开待办事项"
      todoListTip1: "逾期项目会以红色显示"
      todoListTip2: "项目较多时会分页显示"
      moodLogTitle: "心情记录"
      moodLogBody: "以五个等级记录当天心情并回顾近期趋势。还可查看过去七天的平均值以及各记录时段的趋势。"
      moodLogLink: "打开心情记录"
      moodLogTip1: "过去的记录可在之后编辑或删除"
      moodLogTip2: "可设置提醒以提示记录心情"
      mealLogTitle: "饮食记录"
      mealLogBody: "针对早餐、午餐、晚餐和零食，从“吃了”“只吃了一点”“没能吃”中选择，必要时可留下原因或简短备注。<br><br>此功能不会计算分量或热量，也不会为结果评分。它不会责备任何状态，只用于平静地回顾。"
      mealLogLink: "打开饮食记录"
      mealLogTip1: "若身体状况持续令人担忧，请咨询医疗机构"
      mealLogTip2: "可通过右上角的 ! 再次阅读说明"
      gardenTitle: "庭院（培育花朵）"
      gardenBody: "花朵会根据使用 Hataskey 的时间逐渐成长。花开后可为其命名，并加入历代花朵列表。<br><br>主页小组件也能紧凑显示正在培育的花朵进度和已经开放的花朵。"
      gardenLink: "打开庭院"
      gardenTip1: "培育完成后仍可修改花名"
      gardenTip2: "也会出现稀有或有些特别的品种"
      hataskEyeTitle: "Hatask Eye"
      hataskEyeBody: "Hatask Eye 会根据 Hataskey 的使用情况显示一句简短消息。也可将它放在 Hatask 主页上，选择后进入详细页面。"
      hataskEyeLink: "打开 Hatask Eye"
      hataskAppearanceTitle: "Hatask 外观"
      hataskAppearanceBody: "可从沉稳的“季节”、明亮卡片风的“花信”、纸张风的“印刷”和活泼的“旗酷”四种主题中选择。更换外观不会影响已有日程和记录。"
      hataskAppearanceLink: "打开 Hatask 设置"
      hataskAppearanceTip1: "可通过首次使用说明或 Hataskey 独有设置进行更改"
      hatadyOverviewTitle: "什么是 Hatady？"
      hatadyOverviewBody: "Hatady 可按照自己的节奏记录学习、阅读、观影和游戏。通过“我的记录”“大家的活动”和“收藏”，可保存记录、查看公开活动并整理书籍、电影与游戏。"
      hatadyOverviewLink: "打开 Hatady"
      hatadyOverviewTip1: "可为每条记录选择公开对象"
      hatadyOverviewTip2: "也可仅作为自己的私人记录使用"
      studyAndBookshelfTitle: "学习记录与书架"
      studyAndBookshelfBody: "可记录学习材料、科目、所用时间和简短备注。阅读记录还可记录页数和进度。<br><br>书架分为“阅读中”“已读完”“待读”和“想读”，并可按添加日期、书名等排序。"
      studyAndBookshelfTip1: "记录可在之后编辑"
      bookmarksNotesMaterialsTitle: "书签、备注与学习材料"
      bookmarksNotesMaterialsBody: "可在书中感兴趣的页面留下书签和备注。登记学习材料后，之后更容易找到同一材料的记录。"
      goalsReviewTitle: "目标与回顾"
      goalsReviewBody: "集中查看学习时间、记录数量、已读书籍数量和连续天数。还可查看每日活动及各科目用时，用于制定不过度勉强的目标。"
      goalsReviewTip1: "连续天数是回顾的参考，并非竞争"
      publicStudyTitle: "大家的活动"
      publicStudyBody: "可按最新、热门或正在关注查看公开的学习、观影与游戏记录，并向感兴趣的学习记录或作品发送回应与回复。"
      publicStudyTip1: "非公开活动不会显示给其他人"
      hatadySettingsTitle: "外观、显示语言与导出"
      hatadySettingsBody: "可选择三种外观。Hatady 会遵循 Hataskey 本体选择的显示语言。已有记录可作为文本文件保存到设备。"
      hatadySettingsLink: "打开 Hatady 设置"
      externalOverviewTitle: "什么是外部账户连接？"
      externalOverviewBody: "可将另一个 Hataskey 账户或 Samesuki and Chorizoring 的账户连接到当前查看的 Hataskey 服务器，阅读连接目标的帖子，并发布、回复、回应或转帖。<br><br>连接时，请在目标服务器的确认页面核对授权内容，也请事先阅读目标服务器的使用条款。"
      externalOverviewLink: "打开连接设置"
      externalOverviewTip1: "已停止与 Hataike 3-chome 和 Shurinpia 的连接"
      externalOverviewTip2: "若此前使用过这两个服务器，更新时会删除其登录信息和临时保存的表情符号数据"
      externalPostsTitle: "查看外部帖子"
      externalPostsBody: "可分别显示在连接目标关注的用户帖子和该服务器全体公开帖子。在 Hataskey UI 中可通过 +H 和 +L 切换。"
      externalPostsLink: "打开连接设置"
      externalPostsTip1: "可在连接设置中逐项切换要显示的内容"
      favoriteReactionEmojiTitle: "收藏的回应表情符号"
      favoriteReactionEmojiBody: "将在外部帖子中常用的表情符号加入收藏后，即可从表情符号选择器的开头快速使用。"
      favoriteReactionEmojiLink: "管理收藏表情符号"
      externalNotificationsTitle: "外部账户通知"
      externalNotificationsBody: "可在 Hataskey 接收来自连接目标的通知。新通知会显示在画面边缘，并可在专用页面集中查看。"
      externalNotificationsLink: "打开外部通知"
      languageSupportTitle: "Hataskey特色功能的显示语言"
      languageSupportBody: "Hataskey特色功能除日语外，现已支持英语和简体中文显示。包括Hatady在内的对应功能会跟随Hataskey主界面的语言设置统一切换。<br><br>你自己输入的帖子、记录和名称不会被自动翻译。地震和海啸信息仍仅提供日语。"
      languageSupportTip1: "可在设置中的“界面显示语言”里更改语言"
      languageSupportTip2: "切换语言不会更改Hatady记录或各工具的设置"
      languageSupportLink: "打开语言设置"
      chooseUiTitle: "选择界面类型"
      chooseUiBody: "可从标准界面、Hataskey UI 和多栏目牌组界面中选择。Hataskey UI 在智能手机上也便于操作。"
      chooseUiLink: "打开界面设置"
      hatasabaUiTitle: "Hataskey UI"
      hatasabaUiBody: "Hataskey UI 是以浏览帖子为中心的界面。可使用上方项目或左右滑动，在主页、本地、全局等时间线之间切换。不想使用滑动切换时，可在设置中关闭。<br><br>Hataskey UI 2 的外观已整合进此界面，可选择是否让卡片采用磨砂玻璃风格并调整透明程度。设置会同时应用于普通显示和牌组显示。"
      hatasabaUiLink: "打开 Hataskey UI 设置"
      hatasabaUiTip1: "在电脑上可选择上方菜单或左侧菜单"
      hatasabaUiTip2: "可保持设置小窗打开并同时确认外观"
      deckTitle: "Hataskey UI 牌组显示"
      deckBody: "在电脑上，可将主页、本地、通知、列表、频道、剪辑、收藏等排列为多个栏目。每个栏目都可单独刷新，也可从频道栏目直接向该频道发布。"
      deckTip1: "帖子列表仅在栏目内部显示，避免横向扩展过宽"
      noteAnimationTitle: "新帖子出现的动画"
      noteAnimationBody: "可选择让新帖子从上方、左侧、右侧或每次随机方向出现。若不适应动画，也可使用设备的“减少动态效果”设置。"
      noteAnimationLink: "打开动画设置"
      hideReactionEmojiTitle: "隐藏回应表情符号"
      hideReactionEmojiBody: "可单独隐藏不想看到的回应表情符号。在电脑上右键点击表情符号，在智能手机上则通过帖子的 … 菜单进行设置。也可集中隐藏被静音用户添加的回应。"
      hideReactionEmojiLink: "管理显示内容"
      hideBotPostsTitle: "隐藏机器人帖子"
      hideBotPostsBody: "可从时间线隐藏自动发帖的机器人账户帖子。也可设置允许显示的例外，但候选中只会出现机器人账户，无法添加普通账户。<br><br>普通用户转帖机器人帖子时也会隐藏；机器人转帖普通用户帖子时则显示原帖。"
      hideBotPostsLink: "设置机器人显示"
      hideBotPostsTip1: "通知页面和单条帖子页面不会隐藏"
      weatherBackgroundTitle: "天气背景效果"
      weatherBackgroundBody: "当帖子中出现雨、雪、晴天、风、夜间问候等词语时，可在背景显示低调效果。雨滴、阳光、树叶和流星等会出现在画面上。<br><br>不会使用强烈闪烁或类似雷电的效果。此功能默认关闭，不适应动画时可随时停止。"
      weatherBackgroundLink: "设置背景效果"
      weatherBackgroundTip1: "也可选择效果显示时长"
      weatherBackgroundTip2: "若感到身体不适，请立即关闭"
      drawingToolTitle: "绘图工具"
      drawingToolBody: "可在 Hataskey 画面内绘图。能够调整线条粗细、颜色和透明度，分多个图层绘制，并撤销上一步操作。也支持智能手机触控操作。"
      drawingToolTip1: "从发布表单的绘图按钮打开时，可直接附加完成的图画"
      hataCardMakerTitle: "卡片制作器"
      hataCardMakerBody: "使用自己的个人资料制作数字通行证。可以选择普通或金色外观和强调色，并将完成的图片保存到设备。"
      hataCardMakerLink: "打开卡片制作器"
      hataCardMakerTip1: "可以选择普通或金色设计，并将完成的卡片保存为PNG图片"
      hatalyzeTitle: "HATAlyze"
      hatalyzeBody: "Hataskey 内置的功能，在设备上汇总所选范围内自己的帖子以回顾关键词和使用趋势。历史只保存汇总结果、条件和分析版本，不保存帖子正文。不用于医疗或诊断。"
      hatalyzeLink: "打开 HATAlyze"
      hatalyzeTip1: "可以比较历史中的两次汇总结果"
      hatalyzeTip2: "不会将取得的帖子用于分析结果之外的保存目的"
      drawingButtonTitle: "发布表单的绘图按钮"
      drawingButtonBody: "可从撰写帖子的画面打开绘图工具，并直接附加完成的图画。不需要此按钮时，可在 Hataskey 独有设置中隐藏。"
      drawingButtonLink: "设置显示"
      visibilityBorderTitle: "按公开范围区分边框颜色"
      visibilityBorderBody: "可根据帖子发送至公开、主页、关注者或私信，更改发布表单的边框颜色。此功能有助于在发布前发现目标选择错误，并可自行选择每种颜色。"
      visibilityBorderLink: "设置边框颜色"
      privateChannelTitle: "私密频道"
      privateChannelBody: "只有受邀成员能查看私密频道。创建者和副管理员可添加或移除成员，相关用户会收到通知。也可使用口令参加。<br><br>为防止内容流出频道，帖子不能在频道外转帖或引用。频道一旦设为私密，就无法恢复为公开。"
      privateChannelLink: "打开频道"
      privateChannelTip1: "创建需要管理员授予的权限"
      privateChannelTip2: "未参加的用户无法看到其中的帖子"
      feastChallengeTitle: "Utage 挑战"
      feastChallengeBody: "在本地时间线发布包含 utage 的日文汉字、假名或拉丁字母形式之一的帖子，即开始十五分钟挑战。期间无人互动即为成功；收到回应、回复或转帖则失败。"
      feastChallengeTip1: "首次游玩时会显示玩法"
      feastChallengeTip2: "成功次数可在个人资料中查看"
      gamesOverviewTitle: "什么是 Hataskey Games？"
      gamesOverviewBody: "汇总 Hataskey 游戏的页面。这里提供每款游戏的入口，支持的游戏还可与其他用户比较记录。"
      gamesOverviewLink: "打开游戏列表"
      stackingGameTitle: "Tsumitsumi Tower"
      stackingGameBody: "堆叠表情符号并比拼高度。既可单人游玩，也可选择难度与电脑对战。"
      stackingGameLink: "游玩 Tsumitsumi Tower"
      whackEmojiTitle: "敲打表情符号"
      whackEmojiBody: "在规定时间内敲打接连出现的表情符号。可选择限时计分、直到漏掉为止或与电脑对战。"
      whackEmojiLink: "游玩敲打表情符号"
      emojiShootTitle: "自定义表情符号射击"
      emojiShootBody: "击落不断逼近的表情符号。随着推进，对手会增加，还可选择附带不同不利条件的模式。"
      emojiShootLink: "游玩表情符号射击"
      whatsNewGuideTitle: "更新内容说明"
      whatsNewGuideBody: "更新至新版本后，登录并首次打开 Hataskey 时，会显示一次汇总主要新功能与变更的说明。<br><br>关闭后若想再次阅读，请打开“更多！”，然后选择“帮助”中的“近期更新内容”。"
      whatsNewGuideTip1: "可通过说明中的各按钮直接前往所介绍的功能"
      loginDaysAchievementsTitle: "登录天数与成就"
      loginDaysAchievementsBody: "可在 Hatask 主页查看登录 Hataskey 的天数以及距离下一个里程碑的天数。"
      loginDaysAchievementsLink: "打开 Hatask"
      hataskSearchTitle: "Hatask 内搜索"
      hataskSearchBody: "通过 Hatask 的搜索按钮，可集中查找日程、待办事项、心情记录等内容。"
      hataskTutorialTitle: "Hatask 首次使用说明"
      hataskTutorialBody: "首次打开 Hatask 时，会依次介绍画面的主要位置。可随时从设置中重新显示。"
      hataskTutorialLink: "打开 Hatask 设置"
      announcementsFilterTitle: "筛选公告"
      announcementsFilterBody: "可按“当前”与“过去”，以及信息、警告、完成、维护等类型筛选公告。维护公告会始终显示，以免错过。"
      announcementsFilterLink: "打开公告"
      mascotOverviewTitle: "什么是吉祥物功能？"
      mascotOverviewBody: "可在画面上显示喜欢的角色图片，并设置表情和台词。可登记多个角色并进行切换。"
      mascotOverviewLink: "打开吉祥物设置"
      mascotOverviewTip1: "图片可从云盘选择"
      mascotOverviewTip2: "使用此功能可能需要管理员授予权限"
      mascotDisplayTitle: "画面上的显示"
      mascotDisplayBody: "可将吉祥物移动至任意位置，并调整最小化、水平翻转、透明度和模糊。下次打开时会保留位置。"
      expressionsLinesTitle: "表情与台词"
      expressionsLinesBody: "可登记多个表情及与其匹配的台词。表情还可添加跳动、摇摆、旋转等动画。也可选择对话框的位置、大小、方向和文字颜色。"
      autoSwitchTitle: "自动切换表情与台词"
      autoSwitchBody: "可按五秒至三十分钟的间隔，自动切换当前显示的表情和台词。"
      notificationBirthdayTitle: "通知与生日效果"
      notificationBirthdayBody: "收到通知或生日当天，可显示专用表情和台词。通知用表情最多可登记两种。"
      hataskMascotTitle: "Hatask 主页的吉祥物"
      hataskMascotBody: "可将吉祥物作为卡片放在 Hatask 主页。系统会自动调整，避免与画面上悬浮的吉祥物重复。"
      hataskMascotLink: "打开 Hatask"
      mascotTransferTitle: "保存与读取设置"
      mascotTransferBody: "可将吉祥物设置保存为文件，并在其他设备读取，也可用于备份。"
      mascotTransferLink: "打开吉祥物设置"
      hatafeedOverviewTitle: "什么是 HataFeed？"
      hatafeedOverviewBody: "HataFeed 是集中受理 Hataskey 问题反馈、需求、改进建议和表情符号申请的地方。可按类型、状态和发布者筛选话题，并通过回复和回应进行讨论。还可针对特定回复继续回复，并为重要或需要确认的回复添加标记。<br><br>进度计划、公告和表情符号申请也可在同一画面切换。自己话题上的互动会通过通知送达。涉及安全的报告会在只有工作人员可见的区域处理。"
      hatafeedOverviewLink: "打开 HataFeed"
      hatafeedOverviewTip1: "选择报告编号即可直接前往相应内容"
      hatafeedOverviewTip2: "表情符号申请可在确认完成预览后提交"
      betaOverviewTitle: "试用开发中的功能"
      betaOverviewBody: "可通过 HataFeed 试用尚未完成的功能。目前提供一个可在设备内编写并运行简短 C 或 C++ 程序的运行场。"
      betaOverviewLink: "打开 HataFeed"
      betaOverviewTip1: "若功能无法正常运行，请通过 HataFeed 告知我们"
