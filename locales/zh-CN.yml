_serverSettings:
  iconUrl: "图标 URL"
  appIconDescription: "指定当 {host} 显示为 app 时的图标。"
  appIconUsageExample: "如作为书签添加到 PWA 或手机主屏幕时"
  appIconStyleRecommendation: "因为有可能会被裁切为圆形或者圆角矩形，建议使用边缘带有留白背景的图标。"
  appIconResolutionMustBe: "分辨率必须为 {resolution}。"
