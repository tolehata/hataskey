      hataskPlannerText: "日历可切换月、周、日和日程列表，也能移动日程。待办可按今天、之后、优先级或文件夹整理，并批量修改。心情和饮食记录也更容易填写，日程、待办和饮食模板可从同一个图标打开。"
      hataskLink: "打开 Hatask"
      hataskGardenTitle: "Hatask — 看看大家种的花"
      hataskGardenText: "花园新增了大家的花朵画廊。可以按时间从新到旧或从旧到新浏览，查看花名、花语和种花的人。自己的花可以选择向所有人、关注者或仅自己展示。"
