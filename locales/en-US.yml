  _docs:
    pageTitle: "Hataskey Feature Guide"
    pageHeading: "Hataike 2-chome Feature Guide"
    searchPlaceholder: "Search features..."
    all: "All"
    tips: "Tips"
    openSettings: "Open settings"
    footer: "This page covers features unique to Hataike 2-chome. See the official documentation for features provided by CherryPick or Misskey."
    categoryHatask: "Hatask"
    categoryHatady: "Hatady (study and reading records)"
    categoryExternal: "External account connections"
    categoryUi: "Interface and appearance"
    categoryTools: "Useful tools"
    categoryPosting: "Notes and channels"
    categoryGames: "Games"
    categoryOther: "Other"
    categoryMascot: "Mascot"
    categoryFeedback: "HataFeed (feedback and bug reports)"
    categoryBeta: "Experimental features"
    _entries:
      hataskOverviewTitle: "What is Hatask?"
      hataskOverviewBody: "Hatask brings your schedule, tasks, mood, meals, flowers, and other daily records together in one place.<br><br>Select an item at the top of the screen or move left and right to switch features."
      hataskOverviewLink: "Open Hatask"
      hataskOverviewTip1: "You can change the appearance or switch to a dark color scheme in settings"
      calendarAttendanceTitle: "Calendar and attendance"
      calendarAttendanceBody: "View monthly plans and add new events. You can switch to a list and review events by day, week, or month.<br><br>If you publish an event and enable attendance, other users can answer Going, Interested, or Declined. The organizer can check responses and the response deadline."
      calendarAttendanceLink: "Open the calendar"
      calendarAttendanceTip1: "Events can span multiple days"
      calendarAttendanceTip2: "You can choose when to receive an event reminder"
      todoListTitle: "To-do list"
      todoListBody: "Add, complete, edit, and delete tasks. Set deadlines and folders, then sort tasks by creation date or deadline."
      todoListLink: "Open the to-do list"
      todoListTip1: "Overdue tasks appear in red"
      todoListTip2: "Long task lists are split into pages"
      moodLogTitle: "Mood log"
      moodLogBody: "Record each day's mood on a five-point scale and review recent patterns. You can also see the seven-day average and patterns by time of day."
      moodLogLink: "Open the mood log"
      moodLogTip1: "Past records can be edited or deleted later"
      moodLogTip2: "You can set reminders to record your mood"
      mealLogTitle: "Meal log"
      mealLogBody: "For breakfast, lunch, dinner, and snacks, choose Ate, Ate a little, or Could not eat, then add a reason or short note if needed.<br><br>The feature does not calculate portions or calories and does not score your results. It is designed for calm reflection without judging any outcome."
      mealLogLink: "Open the meal log"
      mealLogTip1: "If concerns about your health continue, please consult a medical professional"
      mealLogTip2: "Use the ! button at the upper right to read the explanation again"
      gardenTitle: "Garden (growing flowers)"
      gardenBody: "Flowers grow little by little while you use Hataskey. You can name each flower after it blooms, and it will be added to your flower collection.<br><br>The Home widget also gives you a compact view of the current flower's progress and flowers that have bloomed."
      gardenLink: "Open the garden"
      gardenTip1: "You can rename a flower after it has finished growing"
      gardenTip2: "Rare and unusual varieties may also appear"
      hataskEyeTitle: "Hatask Eye"
      hataskEyeBody: "Hatask Eye displays a short message based on how you use Hataskey. You can also place it on Hatask Home and select it to open the detailed view."
      hataskEyeLink: "Open Hatask Eye"
      hataskAppearanceTitle: "Hatask appearance"
      hataskAppearanceBody: "Choose from the calm Seasonal theme, the bright card-style Floral Signal theme, and the paper-inspired Print theme. Your events and records remain unchanged when you switch themes."
      hataskAppearanceLink: "Open Hatask settings"
      hataskAppearanceTip1: "Change it from the first-run guide or Hataskey custom settings"
      hatadyOverviewTitle: "What is Hatady?"
      hatadyOverviewBody: "Hatady is a place to record study, reading, movie viewing, and game play at your own pace. Use My Log, Activity, and Collection to save records, browse public activity, and organize books, movies, and games."
      hatadyOverviewLink: "Open Hatady"
      hatadyOverviewTip1: "Choose the audience for each record"
      hatadyOverviewTip2: "You can also keep records visible only to yourself"
      studyAndBookshelfTitle: "Study records and bookshelf"
      studyAndBookshelfBody: "Record the material, subject, time spent, and a short note. Reading records can also include page counts and progress.<br><br>Organize your bookshelf into Reading, Finished, Backlog, and Want to read, then sort it by date added, title, and other fields."
      studyAndBookshelfTip1: "Records can be edited later"
      bookmarksNotesMaterialsTitle: "Bookmarks, notes, and study materials"
      bookmarksNotesMaterialsBody: "Add bookmarks and notes to pages that catch your attention. Registering study material makes it easier to find records about the same material later."
      goalsReviewTitle: "Goals and review"
      goalsReviewBody: "Review study time, number of records, books read, and streak length together. Daily activity and time by subject help you set sustainable goals."
      goalsReviewTip1: "Streak length is a reflection aid, not a competition"
      publicStudyTitle: "Activity"
      publicStudyBody: "Browse public study, movie-viewing, and game-play records by newest, trending, or following. React or reply to study records and works that interest you."
      publicStudyTip1: "Private activity is not shown to other people"
      hatadySettingsTitle: "Appearance, display language, and export"
      hatadySettingsBody: "Choose from three appearances. Hatady follows the display language selected for Hataskey itself. You can save your existing records as a text file on your device."
      hatadySettingsLink: "Open Hatady settings"
      externalOverviewTitle: "What are external account connections?"
      externalOverviewBody: "Connect another Hataskey account or an account on Samesuki and Chorizoring to the Hataskey server you are viewing. You can read notes on the connected server and create notes, replies, reactions, and renotes.<br><br>When connecting, review the requested permissions on the destination server. Please also read that server's terms of service beforehand."
      externalOverviewLink: "Open connection settings"
      externalOverviewTip1: "Connections to Hataike 3-chome and Shurinpia have ended"
      externalOverviewTip2: "If you previously used either server, the update removes its login information and cached emoji data"
      externalPostsTitle: "View external notes"
      externalPostsBody: "View notes from people you follow on the connected server separately from that server's public notes. In HatasabaUI, switch between them with +H and +L."
      externalPostsLink: "Open connection settings"
      externalPostsTip1: "Each displayed source can be enabled or disabled in connection settings"
      favoriteReactionEmojiTitle: "Favorite reaction emoji"
      favoriteReactionEmojiBody: "Add emoji you often use on external notes to Favorites so they appear at the start of the emoji picker."
      favoriteReactionEmojiLink: "Manage favorite emoji"
      externalNotificationsTitle: "External account notifications"
      externalNotificationsBody: "Receive notifications from connected servers in Hataskey. New notifications appear at the edge of the screen and can be reviewed together on a dedicated page."
      externalNotificationsLink: "Open external notifications"
      languageSupportTitle: "Languages for Hataskey features"
      languageSupportBody: "Hataskey-specific features can now be displayed in English and Simplified Chinese in addition to Japanese. Supported features, including Hatady, follow Hataskey's main interface language.<br><br>Your own notes, records, and names are not translated. Hanatsune and earthquake or tsunami information remain available in Japanese only."
      languageSupportTip1: "Change the language from Interface language in Settings"
      languageSupportTip2: "Changing the language does not alter your Hatady records or tool settings"
      languageSupportLink: "Open language settings"
      chooseUiTitle: "Choose an interface"
      chooseUiBody: "Choose the standard interface, Hataskey's HatasabaUI, or the multi-column deck interface. HatasabaUI is also designed for comfortable smartphone use."
      chooseUiLink: "Open interface settings"
      hatasabaUiTitle: "HatasabaUI"
      hatasabaUiBody: "HatasabaUI is a Hataskey interface centered on reading notes. Use the items at the top or swipe left and right to switch between Home, Local, Global, and other timelines. You can disable swipe navigation in settings.<br><br>The HatasabaUI 2 appearance is integrated into this interface. Choose whether cards use a frosted-glass style and adjust their transparency. These settings apply to both standard and deck views."
      hatasabaUiLink: "Open HatasabaUI settings"
      hatasabaUiTip1: "On a computer, you can choose between the top menu and left menu"
      hatasabaUiTip2: "Keep the settings window open while checking the appearance"
      deckTitle: "HatasabaUI deck view"
      deckBody: "On a computer, arrange Home, Local, Notifications, Lists, Channels, Clips, Favorites, and other sources in multiple columns. Each column can be refreshed independently, and you can post directly to a channel from its column."
      deckTip1: "Note lists stay inside their columns so they do not spread too widely"
      noteAnimationTitle: "How new notes appear"
      noteAnimationBody: "Choose whether new notes enter from the top, left, right, or a random direction each time. If motion is distracting, you can also use your device's Reduce Motion setting."
      noteAnimationLink: "Open animation settings"
      hideReactionEmojiTitle: "Hide reaction emoji"
      hideReactionEmojiBody: "Hide individual reaction emoji you do not want to see. On a computer, right-click the emoji; on a smartphone, use the note's … menu. You can also hide all reactions added by muted users."
      hideReactionEmojiLink: "Manage visibility"
      hideBotPostsTitle: "Hide bot notes"
      hideBotPostsBody: "Hide notes from automated bot accounts on timelines. You can allow exceptions, but only bot accounts appear as candidates; regular accounts cannot be added.<br><br>A regular user's renote of a bot note is also hidden. When a bot renotes a regular user's note, the original note remains visible."
      hideBotPostsLink: "Configure bot visibility"
      hideBotPostsTip1: "Notes are not hidden on the Notifications screen or individual note pages"
      weatherBackgroundTitle: "Weather background effects"
      weatherBackgroundBody: "When a note includes words related to rain, snow, sunshine, wind, nighttime greetings, and similar topics, subtle effects can appear in the background. Raindrops, sunlight, leaves, and shooting stars may appear on the screen.<br><br>Strong flashes and lightning-like effects are not used. The feature is disabled by default and can be stopped at any time if motion is uncomfortable."
      weatherBackgroundLink: "Configure background effects"
      weatherBackgroundTip1: "You can choose how long effects remain visible"
      weatherBackgroundTip2: "Disable the feature immediately if you feel unwell"
      drawingToolTitle: "Drawing tool"
      drawingToolBody: "Draw inside Hataskey. Change line width, color, and opacity, work on multiple layers, and undo the previous action. Touch controls on smartphones are supported."
      drawingToolTip1: "Open it from the drawing button in the post form to attach the finished drawing directly"
      hataCardMakerTitle: "Card maker"
      hataCardMakerBody: "Create a digital pass from your profile. Choose a standard or gold finish and accent color, then save the finished image to your device."
      hataCardMakerLink: "Open the card maker"
      hataCardMakerTip1: "Choose the standard or gold design and save the finished card as a PNG"
      hatalyzeTitle: "HATAlyze"
      hatalyzeBody: "This external tool reviews your public notes to show frequently used words, posting times, text length, mood patterns, and more. Enjoy the results as entertainment; they must not be used for medical decisions."
      hatalyzeLink: "Open HATAlyze"
      hatalyzeTip1: "Results can be saved as a shareable image"
      hatalyzeTip2: "Retrieved notes are not stored for any purpose other than producing the analysis"
      portalTitle: "Hataskey Portal"
      portalBody: "A page that brings together entry points for Hataskey tools, emoji requests, guidelines, and more."
      drawingButtonTitle: "Drawing button in the post form"
      drawingButtonBody: "Open the drawing tool from the post form and attach your drawing directly. If you do not need the button, hide it in Hataskey custom settings."
      drawingButtonLink: "Configure visibility"
      visibilityBorderTitle: "Border colors by note visibility"
      visibilityBorderBody: "Change the post form's border color based on whether a note will be Public, Home, Followers, or Direct. This helps you notice a mistaken destination before posting, and you can choose each color yourself."
      visibilityBorderLink: "Configure border colors"
      privateChannelTitle: "Private channels"
      privateChannelBody: "Only invited members can view a private channel. Its owner and deputy administrators can add or remove members, and affected users are notified. Members may also join using a passphrase.<br><br>To keep content inside the channel, notes cannot be renoted or quoted outside it. A channel cannot be made public again after it becomes private."
      privateChannelLink: "Open channels"
      privateChannelTip1: "Creating one requires permission granted by an administrator"
      privateChannelTip2: "People who have not joined cannot see its notes"
      feastChallengeTitle: "Utage challenge"
      feastChallengeBody: "Post a Local note containing the word utage in kanji, hiragana, or Latin letters to begin a 15-minute challenge. You succeed if nobody interacts before time runs out; receiving a reaction, reply, or renote means failure."
      feastChallengeTip1: "Instructions appear the first time you play"
      feastChallengeTip2: "Your number of successes appears on your profile"
      gamesOverviewTitle: "What is Hataskey Games?"
      gamesOverviewBody: "A page bringing Hataskey's games together. It provides an entry point for every game, and supported games let you compare records with other users."
      gamesOverviewLink: "Open the game list"
      stackingGameTitle: "Tsumitsumi Tower"
      stackingGameBody: "Stack emoji and compete for height. Play alone or choose a difficulty and compete against the computer."
      stackingGameLink: "Play Tsumitsumi Tower"
      whackEmojiTitle: "Whack-an-Emoji"
      whackEmojiBody: "Hit emoji as they appear. Modes include scoring within a time limit, continuing until you miss, and competing against the computer."
      whackEmojiLink: "Play Whack-an-Emoji"
      emojiShootTitle: "Custom Emoji Shoot"
      emojiShootBody: "Shoot down approaching emoji. More opponents appear as you advance, and you can also choose modes with unusual disadvantages."
      emojiShootLink: "Play Emoji Shoot"
      whatsNewGuideTitle: "What's new guide"
      whatsNewGuideBody: "After an update, a guide to the main new features and changes appears once when you first open Hataskey after signing in.<br><br>To read it again after closing it, open More!, then select Recent updates under Help."
      whatsNewGuideTip1: "Each button in the guide takes you directly to the feature it introduces"
      loginDaysAchievementsTitle: "Login days and achievements"
      loginDaysAchievementsBody: "See how many days you have signed in to Hataskey and how many days remain until the next milestone on Hatask Home."
      loginDaysAchievementsLink: "Open Hatask"
      hataskSearchTitle: "Search Hatask"
      hataskSearchBody: "Use the search button in Hatask to find events, tasks, mood records, and more together."
      hataskTutorialTitle: "Hatask first-run guide"
      hataskTutorialBody: "When you open Hatask for the first time, it introduces the main areas of the screen in order. You can replay it at any time from settings."
      hataskTutorialLink: "Open Hatask settings"
      announcementsFilterTitle: "Filter announcements"
      announcementsFilterBody: "Filter announcements by Current or Past and by types such as Information, Warning, Completed, and Maintenance. Maintenance announcements always remain visible so they are not missed."
      announcementsFilterLink: "Open announcements"
      mascotOverviewTitle: "What is the mascot feature?"
      mascotOverviewBody: "Display a character image on the screen and configure its expressions and dialogue. You can register multiple characters and switch between them."
      mascotOverviewLink: "Open mascot settings"
      mascotOverviewTip1: "Choose images from Drive"
      mascotOverviewTip2: "An administrator-granted permission may be required"
      mascotDisplayTitle: "On-screen display"
      mascotDisplayBody: "Move the mascot anywhere you like and adjust minimization, horizontal flipping, opacity, and blur. Its position is remembered for the next visit."
      expressionsLinesTitle: "Expressions and dialogue"
      expressionsLinesBody: "Register multiple expressions and matching lines. Expressions can also bounce, sway, rotate, and use other motions. Choose the speech bubble's position, size, direction, and text color."
      autoSwitchTitle: "Automatic expression and dialogue switching"
      autoSwitchBody: "Automatically switch the displayed expression and dialogue at intervals from five seconds to 30 minutes."
      notificationBirthdayTitle: "Notification and birthday effects"
      notificationBirthdayBody: "Show dedicated expressions and dialogue when a notification arrives or on your birthday. Up to two notification expressions can be registered."
      hataskMascotTitle: "Mascot on Hatask Home"
      hataskMascotBody: "Place the mascot as a card on Hatask Home. It automatically adjusts to avoid duplicating the mascot displayed over the main interface."
      hataskMascotLink: "Open Hatask"
      mascotTransferTitle: "Save and import settings"
      mascotTransferBody: "Save mascot settings to a file and import them on another device. The file can also be used as a backup."
      mascotTransferLink: "Open mascot settings"
      hatafeedOverviewTitle: "What is HataFeed?"
      hatafeedOverviewBody: "HataFeed is the central place for Hataskey bug reports, requests, improvement ideas, and emoji requests. Filter topics by category, status, or author, and discuss them with replies and reactions. You can reply to a specific response and mark important responses or those needing confirmation.<br><br>Roadmaps, announcements, and emoji requests are available from the same screen. Notifications report activity on your topics. Security-related reports are handled in a staff-only area."
      hatafeedOverviewLink: "Open HataFeed"
      hatafeedOverviewTip1: "Select a report number to open that topic directly"
      hatafeedOverviewTip2: "Emoji requests show a finished preview before submission"
      betaOverviewTitle: "Try features in development"
      betaOverviewBody: "Try unfinished features through HataFeed. Currently, a playground lets you write short C or C++ programs and run them entirely on your device."
      betaOverviewLink: "Open HataFeed"
      betaOverviewTip1: "If something does not work correctly, please report it through HataFeed"
