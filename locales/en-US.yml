    _content:
      headline: "Five major new features and one game have been added, and the base has been updated to Misskey 2026.7.0"
      brandingTitle: "Original icon branding"
      brandingText: "Icons across the settings menu, individual settings pages, error screens, dialogs and the login screen have been replaced with Hataskey's own illustrations. You can switch back to the standard icons at any time from the UI tab of the Hataskey-specific settings. If the server administrator has configured branding images, those take precedence."
      brandingLink: "Open settings"
      hatadyRecordTitle: "Hatady — game and movie records added"
      hatadyRecordText: "In addition to study and reading, you can now record games and movies. You can log player counts and enemy types for versus, co-op and PvE matches, plus kills, deaths, specials, rescues and support per weapon, enabling only the fields you need. Weapon and stage names you have used before are offered as suggestions next time, and My Log lets you show or hide games, movies and study separately. Collections also play a different opening effect for each kind."
      hatadyRecordLink: "Go to Hatady"
      hatadyVisibilityTitle: "Hatady — fixed records failing to save when visibility was changed"
      hatadyVisibilityText: "Fixed an issue where a record could not be saved if its visibility was set to anything other than \"Private\". Movie records that could not be saved were caused by the same problem and are fixed as well."
      hatacordingFixTitle: "HataSNSCordUI — display fixes"
      hatacordingFixText: "Fixed the feast frame being drawn inside the note and overlapping its text; in this UI it now follows the outer edge. The visibility picker now shows an icon for each scope, and the usage circle no longer appears to drain from the bottom."
      hatacordingFixLink: "Go to HataSNSCordUI"
      utageBadgeTitle: "Profile feast badges — corrected counting"
      utageBadgeText: "Because feasts happen on the local timeline, home-visibility posts are no longer counted towards successes or preventions. Only posts with public visibility are counted."
      muteReactionTitle: "Improved hiding reactions from muted users"
      muteReactionText: "The feature that hides reactions from users you have muted has been improved. You can toggle it at any time from the Hataskey-specific settings."
      muteReactionLink: "Open settings"
      cardMakerTitle: "Card maker — interaction and display fixes"
      cardMakerText: "Fixed touch interaction on the card conflicting with page scrolling. The position of the icon decoration on the card image no longer drifts."
      cardMakerLink: "Go to Hatask"
      hatasabaHomeTitle: "HatasabaUI — fixed the home button"
      hatasabaHomeText: "Fixed an issue on smartphones where pressing the home button forced the selected timeline tab back to the home timeline."
      sideStudioFixTitle: "HataSideStudio — placement fixes"
      sideStudioFixText: "Fixed how drop positions are determined and made the guidance clearer when an item cannot be moved."
      sideStudioFixLink: "Go to HataSideStudio"
      mobileFixTitle: "More reliable iPhone and smartphone interaction"
      mobileFixText: "Improved long-press on reactions, and fixed the reaction picker sometimes not opening on iPhone as well as unstable card tilt."
      footerText: "These are only the main changes. See the release notes for every change, including smaller fixes."
      footerLink: "View release notes"
