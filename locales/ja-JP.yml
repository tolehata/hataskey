    _entries:
      hataskOverviewTitle: "Hataskとは"
      hataskOverviewBody: "予定、やること、気分、食事、お花など、毎日の記録を一か所にまとめられるツールです。<br><br>画面上部の項目を選ぶか左右に動かして、使いたい機能へ切り替えられます。"
      hataskOverviewLink: "Hataskを開く"
      hataskOverviewTip1: "見た目や暗い配色への切り替えは設定から変更できます"
      calendarAttendanceTitle: "カレンダー・出欠確認"
      calendarAttendanceBody: "月ごとの予定を見たり、新しい予定を登録したりできます。一覧表示へ切り替え、日・週・月ごとに確認することもできます。<br><br>予定を公開して参加確認を有効にすると、ほかの利用者が「行く・検討中・辞退」で回答できます。主催者は回答状況と締め切りを確認できます。"
      calendarAttendanceLink: "カレンダーを開く"
      calendarAttendanceTip1: "複数日にまたがる予定も作れます"
      calendarAttendanceTip2: "予定のお知らせ時刻を選べます"
      todoListTitle: "やることリスト"
      todoListBody: "やることの追加・完了・編集・削除ができます。期限やフォルダーを設定し、作成日や期限順で並べて確認できます。"
      todoListLink: "やることリストを開く"
      todoListTip1: "期限を過ぎた項目は赤く表示されます"
      todoListTip2: "項目が増えるとページを分けて表示します"
      moodLogTitle: "きもち記録"
      moodLogBody: "その日の気分を5段階で記録し、最近の傾向を振り返れます。過去7日間の平均や、記録した時間帯ごとの傾向も確認できます。"
      moodLogLink: "きもち記録を開く"
      moodLogTip1: "過去の記録はあとから編集・削除できます"
      moodLogTip2: "記録を促すお知らせも設定できます"
      mealLogTitle: "ごはん記録"
      mealLogBody: "朝・昼・夜・間食について「食べられた・少しだけ・食べられなかった」から選び、必要なら理由や短いメモを残せます。<br><br>量やカロリーを計算したり、結果に点数を付けたりはしません。どの状態も責めず、穏やかに振り返るための機能です。"
      mealLogLink: "ごはん記録を開く"
      mealLogTip1: "体調の不安が続くときは医療機関へご相談ください"
      mealLogTip2: "右上の「!」から説明を読み返せます"
      gardenTitle: "お庭（お花育成）"
      gardenBody: "Hataskeyを使っている時間に応じて、お花が少しずつ育ちます。咲いた花には名前を付けられ、これまでのお花の一覧に加わります。<br><br>ホームのウィジェットでも、育成中の花の進み具合と咲いた花をコンパクトに確認できます。"
      gardenLink: "お庭を開く"
      gardenTip1: "育て終えた花の名前はあとから変更できます"
      gardenTip2: "珍しい花や少し変わった品も登場します"
      hataskEyeTitle: "Hatask Eye"
      hataskEyeBody: "Hataskeyの利用状況をもとに、ひとことメッセージを表示します。Hataskのホームにも置け、選ぶと詳しい画面へ移動します。"
      hataskEyeLink: "Hatask Eyeを開く"
      hataskAppearanceTitle: "Hataskの見た目"
      hataskAppearanceBody: "落ち着いた「季」、明るいカード調の「花信」、紙もの風の「刷」から見た目を選べます。見た目を変えても、予定や記録はそのまま残ります。"
      hataskAppearanceLink: "Hataskの設定を開く"
      hataskAppearanceTip1: "初回の案内またはHataskey独自設定から変更できます"
      hatadyOverviewTitle: "Hatadyとは"
      hatadyOverviewBody: "勉強や読書、映画の鑑賞、ゲームのプレイを自分のペースで記録する場所です。「マイログ」「みんなの活動」「コレクション」から、記録を残したり公開された活動を読んだり、本・映画・ゲームを整理したりできます。"
      hatadyOverviewLink: "Hatadyを開く"
      hatadyOverviewTip1: "記録ごとに公開する相手を選べます"
      hatadyOverviewTip2: "自分だけの記録としても使えます"
      studyAndBookshelfTitle: "学習記録と本棚"
      studyAndBookshelfBody: "題材、科目、かかった時間、短いメモを残せます。読書ではページ数や進み具合も記録できます。<br><br>本棚は「読書中・読み終えた・積読・読みたい」に分け、追加日や名前などで並べられます。"
      studyAndBookshelfTip1: "記録はあとから編集できます"
      bookmarksNotesMaterialsTitle: "しおり・メモ・学習題材"
      bookmarksNotesMaterialsBody: "本の気になったページにしおりとメモを残せます。学習題材を登録すると、同じ題材の記録をあとから探しやすくなります。"
      goalsReviewTitle: "目標と振り返り"
      goalsReviewBody: "学習時間、記録数、読んだ本の数、続けた日数をまとめて確認できます。日ごとの活動や科目ごとの時間も見られるため、無理のない目標づくりに使えます。"
      goalsReviewTip1: "続けた日数は競争ではなく振り返りの目安です"
      publicStudyTitle: "みんなの活動"
      publicStudyBody: "公開された学習・映画鑑賞・ゲームプレイの記録を、新しい順・注目順・フォロー中に分けて読めます。気になる学習記録や作品にはリアクションや返信を送れます。"
      publicStudyTip1: "非公開の活動はほかの人に表示されません"
      hatadySettingsTitle: "見た目・表示言語・書き出し"
      hatadySettingsBody: "3種類の見た目を選べます。表示言語はHataskey本体の設定に従います。これまでの記録は文章ファイルとして手元に保存できます。"
      hatadySettingsLink: "Hatadyの設定を開く"
      externalOverviewTitle: "外部アカウント連携とは"
      externalOverviewBody: "別のHataskeyアカウントや「さめすきーとチョリソリング」のアカウントを今見ているHataskeyへつなぎ、接続先の投稿を読んだり、投稿・返信・リアクション・リノートをしたりできます。<br><br>連携時は接続先の確認画面で許可する内容を確かめます。接続先の利用規約も事前にご確認ください。"
      externalOverviewLink: "連携設定を開く"
      externalOverviewTip1: "旗池3丁目とシュリンピアへの連携は終了しました"
      externalOverviewTip2: "以前この2サーバーを利用していた場合、更新時にログイン情報と絵文字の一時保存データを削除します"
      externalPostsTitle: "外部の投稿を見る"
      externalPostsBody: "連携先でフォローしている人の投稿と、連携先全体の公開投稿を別々に表示できます。HatasabaUIでは「＋H」「＋L」から切り替えられます。"
      externalPostsLink: "連携設定を開く"
      externalPostsTip1: "表示する項目は連携設定で個別に切り替えられます"
      favoriteReactionEmojiTitle: "お気に入りのリアクション絵文字"
      favoriteReactionEmojiBody: "外部の投稿でよく使う絵文字をお気に入りへ入れると、絵文字を選ぶ画面の先頭からすぐ使えます。"
      favoriteReactionEmojiLink: "お気に入り絵文字を管理"
      externalNotificationsTitle: "外部アカウントの通知"
      externalNotificationsBody: "連携先で届いた通知をHataskeyでも受け取れます。新しい通知は画面の端に表示され、専用ページでまとめて確認できます。"
      externalNotificationsLink: "外部通知を開く"
      languageSupportTitle: "Hataskey独自機能の表示言語"
      languageSupportBody: "Hataskey独自機能は、日本語に加えて英語と中国語（簡体字）で表示できます。Hatadyを含む対応機能は、Hataskey本体の表示言語に従ってまとめて切り替わります。<br><br>自分で入力した投稿・記録・名前は自動翻訳されません。花常と地震・津波情報は、引き続き日本語のみです。"
      languageSupportTip1: "設定の「UIの表示言語」から変更できます"
      languageSupportTip2: "言語を変えてもHatadyの記録や各ツールの設定はそのまま引き継がれます"
      languageSupportLink: "言語設定を開く"
      chooseUiTitle: "画面の種類を選ぶ"
      chooseUiBody: "標準の画面、Hataskey独自のHatasabaUI、複数の列を並べるデッキ画面から選べます。HatasabaUIはスマートフォンでも操作しやすい構成です。"
      chooseUiLink: "画面の設定を開く"
      hatasabaUiTitle: "HatasabaUI"
      hatasabaUiBody: "投稿を見ることを中心にしたHataskey独自の画面です。上部の項目や左右スワイプで、ホーム・ローカル・グローバルなどを切り替えられます。スワイプで切り替えたくない場合は設定で止められます。<br><br>HatasabaUI 2の見た目もこの画面に統合されており、カードをすりガラス風にするか、透け具合をどの程度にするかを選べます。通常表示とデッキ表示の両方に反映されます。"
      hatasabaUiLink: "HatasabaUIの設定を開く"
      hatasabaUiTip1: "パソコンでは上部メニューと左メニューを選べます"
      hatasabaUiTip2: "設定用の小窓を開いたまま見た目を確かめられます"
      deckTitle: "HatasabaUIのデッキ表示"
      deckBody: "パソコンでは、ホーム、ローカル、通知、リスト、チャンネル、クリップ、お気に入りなどを複数の列に並べられます。列ごとに内容を更新でき、チャンネルの列からそのチャンネルへ直接投稿できます。"
      deckTip1: "投稿一覧が広がりすぎないよう、列の中だけで表示します"
      noteAnimationTitle: "新しい投稿が現れる動き"
      noteAnimationBody: "新しい投稿が表示される方向を、上・左・右・毎回ランダムから選べます。動きが気になる場合は、端末の「視差効果を減らす」設定も利用できます。"
      noteAnimationLink: "動きの設定を開く"
      hideReactionEmojiTitle: "リアクション絵文字の非表示"
      hideReactionEmojiBody: "見たくないリアクション絵文字を個別に隠せます。パソコンでは絵文字を右クリック、スマートフォンでは投稿の「…」メニューから設定できます。ミュートした人が付けたリアクションをまとめて隠すこともできます。"
      hideReactionEmojiLink: "表示を管理する"
      hideBotPostsTitle: "Bot投稿の非表示"
      hideBotPostsBody: "自動投稿を行うBotアカウントの投稿を、タイムラインから隠せます。表示を許可する例外も選べますが、候補にはBotアカウントだけが表示され、通常アカウントは追加できません。<br><br>通常の人がBotの投稿をリノートした場合も隠し、Botが通常の人の投稿をリノートした場合は元の投稿を表示します。"
      hideBotPostsLink: "Bot表示を設定する"
      hideBotPostsTip1: "通知画面や投稿単体の画面では隠しません"
      weatherBackgroundTitle: "天気の背景演出"
      weatherBackgroundBody: "投稿に雨・雪・晴れ・風・夜のあいさつなどの言葉があると、背景に控えめな演出を表示できます。雨粒、日差し、葉、流れ星などが画面に現れます。<br><br>強い点滅や雷のような演出は使いません。初期状態では無効で、動きが苦手な場合はいつでも止められます。"
      weatherBackgroundLink: "背景演出を設定する"
      weatherBackgroundTip1: "演出を表示する長さも選べます"
      weatherBackgroundTip2: "体調に違和感があればすぐに無効にしてください"
      drawingToolTitle: "お絵かきツール"
      drawingToolBody: "Hataskeyの画面内で絵を描けます。線の太さ・色・透明さを変え、複数の層に分けて描いたり、直前の操作を取り消したりできます。スマートフォンの指操作にも対応しています。"
      drawingToolTip1: "投稿フォームのお絵かきボタンから開くと、描いた絵をそのまま添付できます"
      hataCardMakerTitle: "カードメーカー"
      hataCardMakerBody: "自分のプロフィールから、デジタル通行証カードを作れます。通常・ゴールドの外観やアクセント色を選び、完成した画像を端末へ保存できます。"
      hataCardMakerLink: "カードメーカーを開く"
      hataCardMakerTip1: "通常・ゴールドのデザインを選び、完成したPNG画像を端末へ保存できます"
      hatalyzeTitle: "HATAlyze（ハタライズ）"
      hatalyzeBody: "自分の公開投稿から、よく使う言葉、投稿する時間帯、文章の長さ、気分の傾向などを振り返る外部ツールです。結果は娯楽としてお楽しみください。医療的な判断には使えません。"
      hatalyzeLink: "HATAlyzeを開く"
      hatalyzeTip1: "結果は共有用の画像として保存できます"
      hatalyzeTip2: "取得した投稿を分析結果以外の目的で保存しません"
      portalTitle: "Hataskeyポータル"
      portalBody: "Hataskeyの各種ツール、絵文字申請、ガイドラインなどへの入口をまとめたページです。"
      drawingButtonTitle: "投稿フォームのお絵かきボタン"
      drawingButtonBody: "投稿を書く画面からお絵かきツールを開き、描いた絵をそのまま添付できます。ボタンが不要な場合はHataskey独自設定で隠せます。"
      drawingButtonLink: "表示を設定する"
      visibilityBorderTitle: "投稿範囲ごとの枠色"
      visibilityBorderBody: "公開、ホーム、フォロワー、ダイレクトのどこへ投稿するかに応じて、投稿フォームの枠色を変えられます。投稿先の選び間違いに気づきやすくするための機能で、色は自分で選べます。"
      visibilityBorderLink: "枠色を設定する"
      privateChannelTitle: "プライベートチャンネル"
      privateChannelBody: "招待されたメンバーだけが内容を見られるチャンネルです。作成者と副管理者はメンバーを追加・除外でき、追加や除外は本人へ通知されます。あいことばを使って参加する方法もあります。<br><br>内容が外へ出ないよう、チャンネル外へのリノートや引用はできません。一度プライベートにしたチャンネルは公開へ戻せません。"
      privateChannelLink: "チャンネルを開く"
      privateChannelTip1: "作成には管理者から付与された権限が必要です"
      privateChannelTip2: "参加していない人には投稿内容を表示しません"
      feastChallengeTitle: "宴（うたげ）チャレンジ"
      feastChallengeBody: "「宴」「うたげ」「utage」を含む投稿をローカルへ出すと、15分間のチャレンジが始まります。誰からも反応されずに逃げ切ると成功、途中でリアクション・返信・リノートを受けると失敗です。"
      feastChallengeTip1: "初回に遊び方を表示します"
      feastChallengeTip2: "成功回数はプロフィールで確認できます"
      gamesOverviewTitle: "Hataskey Gamesとは"
      gamesOverviewBody: "Hataskeyのゲームをまとめたページです。各ゲームへの入口があり、対応するゲームでは記録をほかの利用者と比べられます。"
      gamesOverviewLink: "ゲーム一覧を開く"
      stackingGameTitle: "つみつみタワー"
      stackingGameBody: "絵文字を積み上げて高さを競うゲームです。一人で遊ぶほか、強さを選んでコンピューターとも対戦できます。"
      stackingGameLink: "つみつみタワーで遊ぶ"
      whackEmojiTitle: "絵文字叩きゲーム"
      whackEmojiBody: "次々に現れる絵文字を時間内に叩くゲームです。時間内の得点を競う遊び方、押しそびれるまで続く遊び方、コンピューターとの対戦があります。"
      whackEmojiLink: "絵文字叩きで遊ぶ"
      emojiShootTitle: "カスタムエモジシュート"
      emojiShootBody: "迫ってくる絵文字を撃ち落とすゲームです。進むほど相手が増え、通常とは違う不利な条件が付く遊び方も選べます。"
