<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#1a1712;font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
  .mincho{font-family:'Shippori Mincho B1',serif}
  .num{font-family:'Bebas Neue',sans-serif;font-feature-settings:"tnum";letter-spacing:.02em}
  a{color:#c9a04e;text-decoration:none}a:hover{color:#d8b878}
  .scr::-webkit-scrollbar{width:8px}.scr::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  @keyframes hana-unroll-evt{0%{transform:scaleY(0);opacity:.6}70%{transform:scaleY(1.03)}100%{transform:scaleY(1);opacity:1}}
  @keyframes hana-slidein{0%{transform:translateX(26px);opacity:0}100%{transform:translateX(0);opacity:1}}
  @keyframes hana-enter{0%{transform:translateY(12px) scale(.98);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes hana-breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
  @keyframes hana-speak{0%{transform:translateY(0)}45%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  @keyframes hana-fadein{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes hana-ripple{0%{transform:scale(0);opacity:.55}100%{transform:scale(1);opacity:0}}
  @keyframes hana-lantern{0%,100%{opacity:.6}50%{opacity:.9}}
  @keyframes hana-drift{0%{transform:translate(0,-16px) rotate(-6deg);opacity:0}14%{opacity:.7}100%{transform:translate(var(--dx,20px),120px) rotate(var(--dr,40deg));opacity:0}}
  @keyframes hana-petal-drift{0%{transform:translateY(-14px) rotate(0);opacity:0}15%{opacity:.7}100%{transform:translateY(110px) rotate(180deg);opacity:0}}
</style>
</helmet>
<div class="stage" ref="{{ stageRef }}" style="min-height:100vh;background:#1a1712;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;--bg:#2b2620;--panel:#3a332b;--ink:#f4efe3;--sub:#b0a692;--line:#4a4238;--cell:#211d18;--paper:#332c24;--accent:#c9a04e;--shu:#c4383d;--ai:#2d4a73;--moss:#5a7a52;--evt:#8e7cb0;--fw:940px;--dur:.32s">

  <div style="width:100%;max-width:1000px;background:#211d18;border:1px solid #4a4238;border-radius:12px;padding:14px 16px;color:#f4efe3;font-size:12.5px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <span class="mincho" style="font-size:15px;color:#c9a04e;letter-spacing:.06em">花常 — イベント様式</span>
      <span style="color:#8a8172;font-size:11.5px">④ イベント画面</span>
      <span style="flex:1"></span>
      <span style="display:flex;gap:8px;font-size:11px;align-items:center">
        <a href="01-core.dc.html">① コア</a><span style="color:#4a4238">/</span>
        <a href="02-meta.dc.html">② メタ</a><span style="color:#4a4238">/</span>
        <a href="03-motion.dc.html">③ 仕様書</a><span style="color:#4a4238">/</span>
        <span style="color:#c9a04e;border-bottom:1px solid #c9a04e;padding-bottom:1px">④ イベント</span>
      </span>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
      <div style="display:flex;gap:6px">
        <button class="seg" onClick="{{ d_pc }}" style="{{ b_base }}">PC 940<sc-if value="{{ isPc }}" hint-placeholder-val="{{ true }}"><span style="{{ barS }}"></span></sc-if></button>
        <button class="seg" onClick="{{ d_mb }}" style="{{ b_base }}">モバイル 390<sc-if value="{{ isMb }}" hint-placeholder-val="{{ false }}"><span style="{{ barS }}"></span></sc-if></button>
      </div>
      <div style="display:flex;gap:6px">
        <button class="seg" onClick="{{ t_lt }}" style="{{ b_base }}">ライト<sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><span style="{{ barS }}"></span></sc-if></button>
        <button class="seg" onClick="{{ t_dk }}" style="{{ b_base }}">ダーク<sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><span style="{{ barS }}"></span></sc-if></button>
      </div>
      <button class="seg" onClick="{{ toggleMotion }}" style="{{ motionBtn }}"><i class="ti ti-player-pause"></i> 動きOFF<sc-if value="{{ motionOff }}" hint-placeholder-val="{{ false }}"><span style="{{ barS }}"></span></sc-if></button>
    </div>
    <div style="height:1px;background:#3a342c;margin:12px 0"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span style="color:#6f675a;font-size:10.5px;width:52px">催し</span>
      <sc-for list="{{ evtThemes }}" as="e" hint-placeholder-count="2">
        <button class="seg" onClick="{{ e.go }}" style="{{ e.style }}">{{ e.label }}</button>
      </sc-for>
      <span style="width:14px"></span>
      <button class="seg" onClick="{{ toggleGuide }}" style="{{ guideBtn }}"><i class="ti ti-crop"></i> 背景ガイド</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px">
      <span style="color:#6f675a;font-size:10.5px;width:52px">画面</span>
      <sc-for list="{{ scenes }}" as="s" hint-placeholder-count="7">
        <button class="seg" onClick="{{ s.go }}" style="{{ s.style }}">{{ s.label }}</button>
      </sc-for>
    </div>
    <div style="color:#6f675a;font-size:10.5px;margin-top:8px">※「催し」を切替えると<span style="color:#8e7cb0">差し色・モチーフ・ポイント意匠・ロゴ</span>の4点だけが差し替わります（構造は共通）。</div>
  </div>

  <div class="frame" style="width:var(--fw);max-width:100%;transition:width .3s ease">
    {{ view }}
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:900}}">
const h = React.createElement;

// ===== イベント様式：差し替わるのはこの4点だけ =====
//  1. evt（差し色1色） 2. motif（上部の装飾） 3. point（ポイント意匠SVG） 4. logo（題字・副題・印章）
const THEMES = {
  magochan: {
    label:'孫の居ぬ間（第1回）',
    name:'孫の居ぬ間になんとやら', subtitle:'探しものは、みつからないほうがいい',
    evt:'#8e7cb0', season:'初夏の昼', motif:'paper', point:'memo',
    pointName:'町の憶え書き', pointDesc:'交換所で品と替えられます',
    charName:'きよ', charLine:'今日はいい天気で。探し物日和ですよ',
    links:[['花仕事','町をまわる','ti-shoe'],['交換所','憶え書きを品に替える','ti-basket'],['この日の話','昼下がりの物語','ti-book']],
    logo:{ lines:[{t:'孫の居ぬ間に'},{t:'なんとやら',indent:true}], seal:'kikyo' },
    archiveWhen:'初夏',
  },
  yoichi: {
    label:'夜市（様式の対比）',
    name:'入舟夜市', subtitle:'八月、通りに灯りが並ぶ',
    evt:'#d97742', season:'夏の夜', motif:'lantern', point:'goldfish',
    pointName:'金魚すくいの札', pointDesc:'交換所で品と替えられます',
    charName:'澪', charLine:'夜のうちに、店の軒先も灯しておきました。',
    links:[['花仕事','夜市のステージへ','ti-flower'],['交換所','札を品に替える','ti-basket'],['この月の話','夜市の物語','ti-book']],
    logo:{ lines:[{t:'入舟夜市'}], seal:'himawari' },
    archiveWhen:'盛夏',
  },
};

class Component extends DCLogic {
  stageRef = React.createRef();
  state = { device:'pc', theme:'dark', motion:true, scene:'eventhome', ready:false, confirm:null, archiveEmpty:false, pts:24, evtKey:'magochan', guide:false };

  async componentDidMount(){ const m=await import('./flowers.js'); this.FL=m.FLOWERS; this.TSUBAKI=m.TSUBAKI; this.TSUBAKI_PETAL=m.TSUBAKI_PETAL; this.setState({ready:true}); this.applyVars(); }
  componentDidUpdate(){ this.applyVars(); }
  T(){ return THEMES[this.state.evtKey]; }
  applyVars(){ const el=this.stageRef.current; if(!el)return; const d=this.state;
    const t=d.theme==='dark'?{bg:'#2b2620',panel:'#3a332b',ink:'#f4efe3',sub:'#b0a692',line:'#4a4238',cell:'#211d18',paper:'#332c24'}:{bg:'#f4efe3',panel:'#eee6d4',ink:'#2b2620',sub:'#776d5c',line:'#dccfb5',cell:'#e7dcc6',paper:'#f0e7d5'};
    for(const k in t) el.style.setProperty('--'+k,t[k]);
    el.style.setProperty('--evt', this.T().evt);
    el.style.setProperty('--fw',(d.device==='pc'?940:390)+'px'); el.style.setProperty('--dur',d.motion?'.32s':'0s'); }
  mob(){ return this.state.device==='mobile'; }
  anim(name){ return this.state.motion?name:'none'; }
  go(scene){ this.setState({scene, confirm:null}); }

  // ---- 差し替え：ポイント意匠 ----
  pointSVG(kind){ kind=kind||this.T().point;
    if(kind==='goldfish') return '<svg viewBox="0 0 64 64" width="100%" height="100%"><rect x="12" y="8" width="40" height="48" rx="3" fill="#f4efe3" stroke="#2b2620" stroke-width="2"/><rect x="12" y="8" width="40" height="9" fill="#d97742"/><path d="M30 40 c-7 0 -12 -4 -12 -9 c0 -5 5 -9 12 -9 c4 0 7 1 9 3 l6 -5 v22 l-6 -5 c-2 2 -5 3 -9 3 Z" fill="#c4383d" stroke="#2b2620" stroke-width="2" stroke-linejoin="round"/><circle cx="26" cy="30" r="2" fill="#2b2620"/></svg>';
    // memo：町の憶え書き（折れた角＋罫。文字は書かない）
    return '<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M14 8 h28 l8 8 v40 h-36 Z" fill="#f4efe3" stroke="#2b2620" stroke-width="2" stroke-linejoin="round"/><path d="M42 8 v8 h8 Z" fill="#e7dcc6" stroke="#2b2620" stroke-width="2" stroke-linejoin="round"/><rect x="14" y="8" width="28" height="6" fill="'+this.T().evt+'"/><line x1="20" y1="30" x2="44" y2="30" stroke="#2b2620" stroke-width="2" opacity="0.5"/><line x1="20" y1="38" x2="44" y2="38" stroke="#2b2620" stroke-width="2" opacity="0.5"/><line x1="20" y1="46" x2="36" y2="46" stroke="#2b2620" stroke-width="2" opacity="0.5"/></svg>'; }
  // ---- 差し替え：装飾モチーフ（motif）----
  paperSlipSVG(){ return '<svg viewBox="0 0 40 30" width="100%" height="100%"><rect x="2" y="2" width="36" height="26" rx="2" fill="#f4efe3" stroke="#2b2620" stroke-width="2"/><line x1="8" y1="12" x2="32" y2="12" stroke="#2b2620" stroke-width="1.5" opacity="0.4"/><line x1="8" y1="19" x2="26" y2="19" stroke="#2b2620" stroke-width="1.5" opacity="0.4"/></svg>'; }
  lanternSVG(){ return '<svg viewBox="0 0 40 60" width="100%" height="100%"><line x1="20" y1="0" x2="20" y2="6" stroke="var(--line)" stroke-width="2"/><rect x="6" y="6" width="28" height="6" rx="2" fill="#2b2620"/><ellipse cx="20" cy="32" rx="15" ry="20" fill="var(--evt)" stroke="#2b2620" stroke-width="2"/><rect x="6" y="50" width="28" height="6" rx="2" fill="#2b2620"/><line x1="12" y1="14" x2="12" y2="50" stroke="rgba(43,38,32,.35)" stroke-width="1.5"/><line x1="28" y1="14" x2="28" y2="50" stroke="rgba(43,38,32,.35)" stroke-width="1.5"/></svg>'; }
  // ---- 差し替え：印章の花（桔梗＝藤色の5弁星形） ----
  kikyoSVG(color){ color=color||this.T().evt; const pts=[]; const cx=32,cy=32;
    for(let i=0;i<5;i++){ const ao=(i*72-90)*Math.PI/180; const ai=((i*72+36)-90)*Math.PI/180;
      pts.push([cx+Math.cos(ao)*27, cy+Math.sin(ao)*27]); pts.push([cx+Math.cos(ai)*11, cy+Math.sin(ai)*11]); }
    const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z';
    let stam=''; for(let i=0;i<5;i++){ const a=(i*72-90)*Math.PI/180; stam+='<line x1="32" y1="32" x2="'+(32+Math.cos(a)*9).toFixed(1)+'" y2="'+(32+Math.sin(a)*9).toFixed(1)+'" stroke="#f4efe3" stroke-width="1.6"/>'; }
    return '<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="'+d+'" fill="'+color+'" stroke="#2b2620" stroke-width="2" stroke-linejoin="round"/>'+stam+'<circle cx="32" cy="32" r="3" fill="#f4efe3" stroke="#2b2620" stroke-width="1.4"/></svg>'; }
  sealSVG(kind){ if(kind==='kikyo') return this.kikyoSVG(); if(kind==='himawari') return (this.FL&&this.FL.himawari)?this.FL.himawari.svg:''; return (this.FL&&this.FL.sakura)?this.FL.sakura.svg:''; }

  frameShell(children,opts){ const mob=this.mob(); opts=opts||{};
    return h('div',{style:{background: opts.paper?'var(--paper)':'var(--panel)',borderRadius:16,border:'1px solid var(--line)',color:'var(--ink)',position:'relative',boxShadow:'0 18px 50px rgba(0,0,0,.35)',overflow:'hidden',minHeight: mob?680:600}}, children); }
  head(title,sub,back){ const mob=this.mob(); return h('div',{style:{padding:mob?'16px 18px 12px':'22px 28px 14px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:12}},[
    back&&h('button',{key:'b',onClick:()=>this.go('eventhome'),style:{background:'none',border:'none',color:'var(--sub)',cursor:'pointer',padding:0,display:'flex',alignItems:'center'}},h('i',{className:'ti ti-arrow-left',style:{fontSize:20}})),
    h('div',{key:'t',style:{flex:1}},[h('div',{key:'a',className:'mincho',style:{fontSize:mob?19:23,color:'var(--ink)'}},title),sub&&h('div',{key:'s',style:{fontSize:12,color:'var(--sub)',marginTop:3}},sub)])
  ]); }
  card(children,onClick,extra){ return h('div',{onClick,style:{background:'var(--cell)',border:'1px solid var(--line)',borderRadius:12,padding:16,cursor:onClick?'pointer':'default',transition:'transform .12s,box-shadow .2s',...(extra||{})},className:onClick?'mcard':''}, children); }
  btn(label,primary,onClick,key,extra){ return h('button',{key,onClick,style:{padding:'12px 20px',borderRadius:10,border:primary?'none':'1px solid var(--line)',background:primary?'var(--shu)':'transparent',color:primary?'#f4efe3':'var(--ink)',fontSize:14,cursor:'pointer',fontFamily:"'Zen Kaku Gothic New',sans-serif",fontWeight:primary?700:500,minHeight:46,...(extra||{})}}, label); }

  tachie(w,hgt,label){ return h('div',{style:{width:w,height:hgt,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',pointerEvents:'none',animation:this.anim('hana-enter .32s cubic-bezier(.34,1.56,.64,1) both')}},
      h('div',{style:{width:'100%',height:'100%',transformOrigin:'center bottom',animation:this.anim('hana-breath 4s ease-in-out infinite')}},
        h('div',{style:{width:'100%',height:'100%',background:'var(--cell)',border:'2px dashed var(--line)',borderRadius:'46% 46% 12px 12px',position:'relative',opacity:.95}},[
          h('div',{key:'hd',style:{position:'absolute',top:'7%',left:'50%',transform:'translateX(-50%)',width:'44%',aspectRatio:'1',borderRadius:'50%',background:'var(--panel)',border:'1px solid var(--line)'}}),
          h('div',{key:'lb',className:'num',style:{position:'absolute',bottom:10,left:0,right:0,textAlign:'center',fontFamily:'monospace',fontSize:10,color:'var(--sub)',letterSpacing:'.04em',lineHeight:1.5}},label)
        ])));
  }

  // ---- 装飾モチーフ層 ----
  motifLayer(mob){ const T=this.T(); const motion=this.state.motion;
    if(T.motif==='lantern'){ return h('div',{key:'lant',style:{position:'absolute',top:-6,left:0,right:0,height:70,display:'flex',justifyContent:'space-around',alignItems:'flex-start',padding:'0 24px',opacity:.9,pointerEvents:'none'}},
      Array.from({length: mob?5:9},(_,i)=>h('div',{key:i,style:{width:mob?22:26,height:mob?34:40,animation:this.anim(`hana-lantern ${3+i%3}s ease-in-out ${i*.2}s infinite`)},dangerouslySetInnerHTML:{__html:this.lanternSVG()}}))); }
    // paper：紙片が同時5枚までゆっくり流れる
    const seed=[[8,18,26],[30,-14,-30],[54,22,50],[72,-10,-46],[90,16,34]];
    return h('div',{key:'paper',style:{position:'absolute',top:0,left:0,right:0,height:mob?150:180,overflow:'hidden',pointerEvents:'none'}},
      seed.map((s,i)=>h('div',{key:i,style:{position:'absolute',left:s[0]+'%',top:0,width:mob?26:32,height:mob?20:24,['--dx']:s[1]+'px',['--dr']:s[2]+'deg',opacity: motion?0:.6,animation:this.anim(`hana-drift ${6+i}s linear ${i*1.1}s infinite`)},dangerouslySetInnerHTML:{__html:this.paperSlipSVG()}})));
  }

  // ---- 背景セーフゾーン・ガイド（開発用・製品には出ない） ----
  guideLayer(mob){ const dash='1px dashed var(--evt)'; const note=(txt,st)=>h('div',{style:{position:'absolute',fontFamily:'monospace',fontSize:9.5,color:'var(--evt)',letterSpacing:'.02em',...(st||{})}},txt);
    const tw=mob?120:170, th=mob?300:400;
    return h('div',{key:'guide',style:{position:'absolute',inset:0,pointerEvents:'none',zIndex:3}},[
      // 上部30%：主題を置く
      h('div',{key:'top',style:{position:'absolute',left:0,right:0,top:0,height:'30%',borderBottom:dash,background:'rgba(142,124,176,.05)'}}),
      note('▲ 上部30%：ここに主題を置く',{top:6,left:10}),
      // 中央上：ロゴが乗る
      h('div',{key:'logo',style:{position:'absolute',left:'50%',top:'8%',transform:'translateX(-50%)',width:mob?200:260,height:mob?84:104,border:dash,borderRadius:10}}),
      note('ロゴ枠',{top:'8%',left:'50%',transform:'translate(6px,4px)'}),
      // 中央下40%：情報帯／主題を置かない
      h('div',{key:'info',style:{position:'absolute',left:0,right:0,bottom:0,height:'40%',borderTop:dash,background:'rgba(142,124,176,.08)'}}),
      note('▼ 中央下40%：情報が乗る／主題を置かない',{bottom:6,left:10}),
      // 左右下端：立ち絵
      h('div',{key:'tl',style:{position:'absolute',left:mob?8:20,bottom:0,width:tw,height:th,border:dash,borderBottom:'none',borderRadius:'40% 40% 0 0',background:'rgba(142,124,176,.05)'}}),
      h('div',{key:'tr',style:{position:'absolute',right:mob?8:20,bottom:0,width:tw,height:th,border:dash,borderBottom:'none',borderRadius:'40% 40% 0 0',background:'rgba(142,124,176,.05)'}}),
      note('立ち絵 '+tw+'×'+th,{left:mob?10:22,bottom:'42%'}),
      note('注：開発用の目安表示。製品画面には出ません',{bottom:'41%',left:'50%',transform:'translateX(-50%)',color:'var(--sub)'})
    ]);
  }

  // ---------- ① イベントホーム ----------
  eventhome(){ const mob=this.mob(); const T=this.T();
    const linkCard=(title,desc,icon,accent,onClick)=>this.card(h('div',{style:{display:'flex',alignItems:'center',gap:14}},[
      h('div',{key:'i',style:{width:44,height:44,borderRadius:10,background:'var(--panel)',border:'1px solid '+(accent?'var(--evt)':'var(--line)'),display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}, h('i',{className:'ti '+icon,style:{fontSize:21,color: accent?'var(--evt)':'var(--accent)'}})),
      h('div',{key:'t',style:{flex:1,minWidth:0}},[h('div',{key:'a',className:'mincho',style:{fontSize:16,color:'var(--ink)'}},title),h('div',{key:'b',style:{fontSize:11.5,color:'var(--sub)',marginTop:2}},desc)]),
      h('i',{key:'c',className:'ti ti-chevron-right',style:{color:'var(--sub)',fontSize:18}})
    ]),onClick);
    const evtRGB = T.evt==='#8e7cb0'?'142,124,176':'217,119,66';
    const bg=h('div',{key:'bg',style:{position:'absolute',inset:0,overflow:'hidden'}},[
      h('div',{key:'grad',style:{position:'absolute',inset:0,background:`linear-gradient(180deg, rgba(${evtRGB},.16), transparent 42%), var(--paper)`}}),
      h('div',{key:'ph',style:{position:'absolute',inset:0,opacity:.5,background:`repeating-linear-gradient(135deg, transparent 0 22px, rgba(${evtRGB},.05) 22px 44px)`}}),
      this.state.guide ? this.guideLayer(mob) : this.motifLayer(mob),
      h('div',{key:'lbl',className:'num',style:{position:'absolute',bottom:8,right:12,fontFamily:'monospace',fontSize:10,color:'var(--sub)',opacity:.6}}, this.state.guide?'SAFE-ZONE GUIDE':'EVENT BG ART（'+T.season+'）')
    ]);
    const content=h('div',{style:{position:'relative',zIndex:2,padding:mob?'56px 22px 24px':'70px 40px 32px'}},[
      h('div',{key:'top',style:{textAlign:'center',marginBottom:mob?22:28}},[
        h('div',{key:'logo',style:{minHeight:mob?84:104,display:'flex',alignItems:'center',justifyContent:'center'}}, this.logoBlock('h',true)),
        h('div',{key:'rem',style:{fontSize:12.5,color:'var(--sub)',marginTop:14}},[h('span',{key:1},'開催時間 のこり '),h('span',{key:2,className:'num',style:{fontSize:17,color:'var(--sub)'}},'6'),h('span',{key:3},'日')])

      h('div',{key:'3'},'・それでも入らない長題：級数のみ更に一段落とす（折り返しは避ける）。'),
      h('div',{key:'4'},'・印章は左・固定寸。罫は --evt。副題は常に1行ゴシック。')
    ]);
    return this.frameShell([
      this.head('ロゴ・様式','テーマ切替に追従（SVG / CSS 組み）。',true),
      h('div',{key:'body',className:'scr',style:{padding:mob?'18px':'26px 30px',display:'flex',flexDirection:'column',gap:18,maxHeight:mob?560:520,overflowY:'auto'}},[
        panel('A — ゲーム本体ロゴ「花常」', gameA_h),
        panel('B — イベントロゴの型（現在の催し：'+T.name+'）', h('div',{style:{display:'flex',justifyContent:'center',padding:'6px 0'}}, this.logoBlock('h'))),
        panel('差し替え早見 — 4点だけで別の催しになる', h('div',null,[
          h('div',{key:'sw',style:{display:'flex',gap:12,flexDirection:mob?'column':'row'}},[swatch('magochan'),swatch('yoichi')]),
          memo
        ]))
      ])
    ]);
  }

  view(){ if(!this.state.ready) return h('div',{style:{padding:60,textAlign:'center',color:'#8a8172'}},'…');
    const map={eventhome:this.eventhome(),stages:this.stages(),exchange:this.exchange(),result:this.result(),archive:this.archive(),loading:this.loading(),logos:this.logos()};
    return map[this.state.scene]; }

  renderVals(){ const d=this.state;
    const seg=(a)=>({padding:'7px 12px',borderRadius:8,border:'1px solid '+(a?'#c9a04e':'#4a4238'),background:a?'rgba(201,160,78,.16)':'#2b2620',color:a?'#f4efe3':'#b0a692',fontSize:12,cursor:'pointer',position:'relative',fontFamily:"'Zen Kaku Gothic New',sans-serif"});
    const defs=[['eventhome','イベントホーム'],['stages','ステージ一覧'],['exchange','交換所'],['result','周回リザルト'],['archive','アーカイブ'],['loading','ローディング'],['logos','ロゴ・様式']];
    const evtDefs=Object.keys(THEMES).map(k=>[k,THEMES[k].label]);
    return { stageRef:this.stageRef, view:this.view(),
      b_base:'padding:7px 12px;border-radius:8px;border:1px solid #4a4238;background:#2b2620;color:#cfc6b4;font-size:12px;cursor:pointer;position:relative;font-family:inherit',
      barS:'position:absolute;left:8px;right:8px;bottom:3px;height:2px;background:#c9a04e;border-radius:2px',
      motionBtn:(d.motion?'padding:7px 12px;border-radius:8px;border:1px solid #4a4238;background:#2b2620;color:#cfc6b4;':'padding:7px 12px;border-radius:8px;border:1px solid #c9a04e;background:rgba(201,160,78,.16);color:#f4efe3;')+'font-size:12px;cursor:pointer;position:relative;font-family:inherit',
      guideBtn:(d.guide?'padding:7px 12px;border-radius:8px;border:1px solid #8e7cb0;background:rgba(142,124,176,.18);color:#f4efe3;':'padding:7px 12px;border-radius:8px;border:1px solid #4a4238;background:#2b2620;color:#cfc6b4;')+'font-size:12px;cursor:pointer;font-family:inherit',
      isPc:d.device==='pc',isMb:d.device==='mobile',isLight:d.theme==='light',isDark:d.theme==='dark',motionOff:!d.motion,
      d_pc:()=>this.setState({device:'pc'}),d_mb:()=>this.setState({device:'mobile'}),
      t_lt:()=>this.setState({theme:'light'}),t_dk:()=>this.setState({theme:'dark'}),
      toggleMotion:()=>this.setState(s=>({motion:!s.motion})),
      toggleGuide:()=>this.setState(s=>({guide:!s.guide, scene:'eventhome'})),
      evtThemes:evtDefs.map(([k,l])=>({label:l,style:seg(d.evtKey===k),go:()=>this.setState({evtKey:k})})),
      scenes:defs.map(([k,l])=>({label:l,style:seg(d.scene===k),go:()=>this.go(k)})),
    };
  }
}

</script>
</body>
