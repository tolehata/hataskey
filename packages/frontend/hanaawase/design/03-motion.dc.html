<!DOCTYPE html>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#1a1712;font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
  .mincho{font-family:'Shippori Mincho B1',serif}
  .mono{font-family:'DejaVu Sans Mono',ui-monospace,Menlo,Consolas,monospace}
  .num{font-family:'Bebas Neue',sans-serif}
  a{color:#c9a04e;text-decoration:none}a:hover{color:#d8b878}
  @keyframes hana-flash{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
  @keyframes hana-pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(0);opacity:0}}
  @keyframes hana-land{0%{transform:scaleX(1.18) scaleY(.82)}60%{transform:scaleX(.94) scaleY(1.06)}100%{transform:scaleX(1) scaleY(1)}}
  @keyframes hana-petal{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.9)}100%{opacity:0;transform:translate(26px,-22px) rotate(200deg) scale(.5)}}
  @keyframes hana-score{0%{opacity:0;transform:translateY(4px) scale(.8)}25%{opacity:1;transform:translateY(-8px) scale(1.05)}100%{opacity:0;transform:translateY(-32px) scale(1)}}
  @keyframes hana-sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
  @keyframes hana-oosglow{0%,100%{opacity:.25}50%{opacity:.7}}
  @keyframes hana-tele{0%,100%{opacity:.15}50%{opacity:.7}}
  @keyframes hana-rain{0%{transform:translateY(-40px) rotate(0);opacity:0}12%{opacity:.7}100%{transform:translateY(120px) rotate(200deg);opacity:0}}
  @keyframes hana-frost-grow{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes hana-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-1px)}}
  @keyframes hana-hitstop{0%{filter:brightness(1)}40%{filter:brightness(1.6)}100%{filter:brightness(1)}}
  @keyframes hana-defeat-light{0%{opacity:0;transform:scale(.6)}40%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
  @keyframes hana-unroll{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
  @keyframes hana-unroll-evt{0%{transform:scaleY(0);opacity:.6}70%{transform:scaleY(1.03)}100%{transform:scaleY(1);opacity:1}}
  @keyframes hana-slidein{0%{transform:translateX(26px);opacity:0}100%{transform:translateX(0);opacity:1}}
  @keyframes hana-enter{0%{transform:translateY(12px) scale(.98);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes hana-breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
  @keyframes hana-speak{0%{transform:translateY(0)}45%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  @keyframes hana-count{0%{transform:translateY(6px);opacity:0}70%{transform:translateY(-2px)}100%{transform:translateY(0);opacity:1}}
</style>
</helmet>
<div class="stage" ref="{{ stageRef }}" style="min-height:100vh;background:var(--bg,#2b2620);padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;--bg:#2b2620;--panel:#3a332b;--ink:#f4efe3;--sub:#b0a692;--line:#4a4238;--cell:#211d18;--accent:#c9a04e;--shu:#c4383d;--ai:#2d4a73;--moss:#5a7a52;transition:background .3s">

  <div style="width:100%;max-width:1000px;background:#211d18;border:1px solid #4a4238;border-radius:12px;padding:14px 16px;color:#f4efe3;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="mincho" style="font-size:15px;color:#c9a04e;letter-spacing:.06em">花常</span>
    <span style="color:#8a8172;font-size:11.5px">③ モーション仕様書</span>
    <span style="flex:1"></span>
    <button class="seg" onClick="{{ toggleTheme }}" style="padding:7px 12px;border-radius:8px;border:1px solid #4a4238;background:#2b2620;color:#cfc6b4;font-size:12px;cursor:pointer;font-family:inherit"><i class="ti ti-contrast"></i> {{ themeLabel }}</button>
    <span style="display:flex;gap:8px;font-size:11px;align-items:center">
      <a href="01-core.dc.html">① コア</a><span style="color:#4a4238">/</span>
      <a href="02-meta.dc.html">② メタ</a><span style="color:#4a4238">/</span>
      <span style="color:#c9a04e;border-bottom:1px solid #c9a04e;padding-bottom:1px">③ 仕様書</span><span style="color:#4a4238">/</span>
      <a href="04-event.dc.html">④ イベント</a>
    </span>
  </div>

  <div class="doc" style="width:100%;max-width:1000px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden">
    {{ body }}
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:900}}">
const h = React.createElement;

const BASIC = [
  {el:'ピース消滅・閃光', kf:'hana-flash', desc:'opacity 0 → .9 → 0（消える一瞬だけ白く飛ぶ）', dur:'120ms', delay:'0', ease:'ease', sample:'flash'},
  {el:'ピース消滅・弾け', kf:'hana-pop', desc:'scale 1 → 1.28 → 0（膨らんでから消える）', dur:'300ms', delay:'閃光後 ~40ms', ease:'cubic-bezier(.34,1.56,.64,1)', sample:'pop'},
  {el:'花びらの粒（4〜6粒）', kf:'hana-petal', desc:'各粒 translate(ランダム)＋rotate＋scale .9→.5、fade out', dur:'720ms', delay:'消滅と同時・粒ごとに±40ms', ease:'ease-out', sample:'petal'},
  {el:'スコア数字の浮上', kf:'hana-score', desc:'translateY 4 → -32、opacity 0→1→0、scale .8→1.05', dur:'750ms', delay:'消滅と同時', ease:'ease-out', sample:'score'},
  {el:'落下（上から補充）', kf:'transform遷移', desc:'translateY を補充位置→着地位置へ。段数ぶん時間差', dur:'320ms', delay:'消滅・詰めの後', ease:'cubic-bezier(.34,1.56,.64,1)', sample:'fall'},
  {el:'着地スカッシュ', kf:'hana-land', desc:'scaleX 1.18 / scaleY .82 → 戻す。scaleX・scaleYを逆方向に動かし面積を保持（単一scale()にしない）', dur:'220ms', delay:'落下着地の瞬間', ease:'ease-out', sample:'land'},
  {el:'連鎖エスカレーション', kf:'（演出倍率）', desc:'連鎖ごとに各演出を約1割ずつ拡大。コンボ表示は漢数字（二連・三連…）', dur:'—', delay:'連鎖ごと', ease:'—', sample:null},
  {el:'画面の揺れ（3連鎖以上）', kf:'hana-shake', desc:'盤面を translate ±1〜2px で微振動', dur:'300ms', delay:'3連鎖成立時', ease:'ease', sample:'shake'},
  {el:'ヒットストップ（大量消し／ブースター起爆）', kf:'hana-hitstop', desc:'全体を60〜90ms停止＋brightness 1→1.6→1。時間を「溜める」', dur:'280ms（うち停止60〜90ms）', delay:'起爆の瞬間', ease:'ease', sample:'hitstop'},
  {el:'季節外れの花・常時', kf:'hana-sway ＋ hana-oosglow', desc:'rotate ±3.5° をゆっくり反復（下端支点）＋淡く明滅。一目で「前月の花」と分かる控えめな差別化', dur:'sway 3.4s / glow 2.6s', delay:'0（常時 infinite）', ease:'ease-in-out', sample:'sway'},
  {el:'季節外れの花・消滅', kf:'hana-pop ＋ 専用花びら', desc:'通常消滅に加え、専用の花びら（椿）を撒く特別演出', dur:'~0.4s', delay:'消滅時', ease:'overshoot', sample:'petal'},
  {el:'月クリア（花吹雪）', kf:'hana-rain', desc:'その月の花びらが画面上から舞い落ちる', dur:'2.2〜3.2s（粒ごとランダム）', delay:'クリア確定後・粒ごとランダム', ease:'linear', sample:'rain'},
  {el:'画面遷移・絵巻物', kf:'hana-unroll', desc:'transform-origin:top で scaleY 0→1。巻物を引き下ろす／めくる', dur:'500ms', delay:'0', ease:'cubic-bezier(.34,1.4,.64,1)', sample:'unroll'},
];
const BOSS = [
  {el:'ボス登場', kf:'（翳り→天候開始）', desc:'画面が墨のにじむように翳る → 天候エフェクト開始。人型は出さない（ボスは天候）', dur:'2s以内', delay:'ボス戦開始時', ease:'ease-in', sample:null},
  {el:'天候の持続（大霜＝霜／冷気）', kf:'hana-rain（結晶）', desc:'霜の結晶がまばらに降る／上部に冷気の層。盤面の視認性を絶対に妨げない（プレイ可能性 > 演出）', dur:'3〜5s ループ', delay:'常時', ease:'linear', sample:'rain'},
  {el:'行動予告（テレグラフ）', kf:'hana-tele', desc:'次に凍るマスを1手前から破線枠で明滅（opacity .15↔.7）。本作の設計上とても重要', dur:'1.1s ループ', delay:'発動の1手前から', ease:'ease-in-out', sample:'tele'},
  {el:'凍結マス', kf:'hana-frost-grow', desc:'白20%オーバーレイ＋角から六角の霜結晶が scale 0→1 で成長。凍結中は動かせない', dur:'500ms', delay:'凍結発生時', ease:'ease-out', sample:'frost'},
  {el:'予告→発動', kf:'hana-shake', desc:'予告マスの明滅 → 発動時に小さな画面シェイク', dur:'300ms', delay:'発動の瞬間', ease:'ease', sample:'shake'},
  {el:'撃破・光', kf:'hana-defeat-light', desc:'ヒットストップ → 雲が引いて光が差す（scale .6→1.6、opacity 0→.9→0）', dur:'2.4s', delay:'季節ゲージ 0 到達時', ease:'ease-out', sample:'light'},
  {el:'撃破・花吹雪（椿）', kf:'hana-rain', desc:'冬の花・椿が舞う。ゲーム中最大の演出だが 3s 以内に収める', dur:'3s以内', delay:'光の直後', ease:'linear', sample:'rain'},
];
const SOUND = [
  ['消滅の瞬間','短い「ぱらっ」。ピースの色（花種）でわずかに音色を変える'],
  ['連鎖ごと','消滅音のピッチを連鎖数ぶん上げる（二連→三連で上昇）'],
  ['落下・着地','低めの「とん」。スカッシュのボトムに合わせる'],
  ['ヒットストップ明け','停止が解ける瞬間に「ぱぁん」と抜ける一撃'],
  ['行動予告','予告明滅に合わせた、ごく小さな「ち…ち…」'],
  ['撃破','ヒットストップ→無音の溜め→光と同時に一番大きな音'],
];
const EVENT = [
  {el:'通常ホーム→イベントホーム', kf:'hana-unroll-evt', desc:'絵巻物 hana-unroll の変奏。scaleY 0→1.03→1（幕が下りる）＋opacity。わずかに華やかに', dur:'500ms', delay:'0', ease:'cubic-bezier(.34,1.56,.64,1)', sample:'unrollEvt'},
  {el:'イベントホーム→交換所/ステージ', kf:'hana-slidein', desc:'横方向のスライド＋フェード。translateX 26→0、opacity 0→1', dur:'280ms', delay:'0', ease:'ease-out', sample:'slide'},
  {el:'リザルト→もう一度', kf:'（遷移なし）', desc:'演出を挟まず即座に盤面へ。周回の快適さを最優先し、ここだけ速さを採る', dur:'0ms（即時）', delay:'0', ease:'—', sample:null},
  {el:'立ち絵・登場', kf:'hana-enter', desc:'下から translateY 12→0 ＋ opacity 0→1 ＋ scale .98→1', dur:'320ms', delay:'画面表示時', ease:'overshoot', sample:'enter'},
  {el:'立ち絵・一言（発話）', kf:'hana-speak', desc:'軽い上下 translateY 0→-6→0。店にいる人の所作。大げさにしない', dur:'260ms', delay:'台詞更新時', ease:'overshoot', sample:'speak'},
  {el:'立ち絵・待機', kf:'hana-breath', desc:'ごく浅い呼吸 scaleY 1↔1.012（下端支点）', dur:'4s ループ', delay:'0（常時）', ease:'ease-in-out', sample:'breath'},
  {el:'ポイント加算（リザルト）', kf:'hana-count', desc:'.num の数字が回り、末尾で軽く弾む。花びらが数枚舞う程度に留める', dur:'600ms', delay:'リザルト表示後', ease:'overshoot', sample:'count'},
  {el:'交換の確定', kf:'hana-enter', desc:'確認モーダルが下から迫り出す（登場と同型）。所持ポイントが減算', dur:'300ms', delay:'「交換する」押下時', ease:'overshoot', sample:'enter'},
  {el:'灯りの明滅（背景）', kf:'hana-lantern', desc:'提灯の opacity .6↔.9 をゆるやかに。差し色1色のみ。うるさくしない', dur:'3〜5s ループ', delay:'0（常時・灯ごとにずらす）', ease:'ease-in-out', sample:'lantern'},
];

class Component extends DCLogic {
  stageRef = React.createRef();
  state = { theme:'dark' };
  async componentDidMount(){ const m=await import('./flowers.js'); this.FL=m.FLOWERS; this.TSUBAKI_PETAL=m.TSUBAKI_PETAL; this.forceUpdate(); this.applyVars(); }
  componentDidUpdate(){ this.applyVars(); }
  applyVars(){ const el=this.stageRef.current; if(!el)return;
    const t=this.state.theme==='dark'?{bg:'#2b2620',panel:'#3a332b',ink:'#f4efe3',sub:'#b0a692',line:'#4a4238',cell:'#211d18'}:{bg:'#f4efe3',panel:'#eee6d4',ink:'#2b2620',sub:'#776d5c',line:'#dccfb5',cell:'#e7dcc6'};
    for(const k in t) el.style.setProperty('--'+k,t[k]); }

  play(node,anim,dur){ if(!node)return; const targets=node.querySelectorAll('.spx'); targets.forEach(t=>{ t.style.animation='none'; void t.offsetWidth; t.style.animation=anim; }); }
  sampleEl(kind){
    const sakura=(this.FL&&this.FL.sakura)?this.FL.sakura.svg:'';
    const petal=(this.FL&&this.FL.sakura)?this.FL.sakura.petal:'';
    const frost='<svg viewBox="0 0 32 32" width="100%" height="100%"><g stroke="#dfe8ef" stroke-width="2" fill="none">'+Array.from({length:6},(_,i)=>{const a=i*60*Math.PI/180;return `<line x1="16" y1="16" x2="${(16+Math.cos(a)*13).toFixed(1)}" y2="${(16+Math.sin(a)*13).toFixed(1)}"/>`;}).join('')+'</g></svg>';
    const box={width:44,height:44,position:'relative'};
    const swatch=(inner,extra)=>h('div',{className:'spx',style:{width:44,height:44,...(extra||{})},dangerouslySetInnerHTML: typeof inner==='string'?{__html:inner}:undefined}, typeof inner==='string'?undefined:inner);
    switch(kind){
      case 'flash': return h('div',{style:box},[h('div',{key:1,style:{width:44,height:44},dangerouslySetInnerHTML:{__html:sakura}}),h('div',{key:2,className:'spx',style:{position:'absolute',inset:4,borderRadius:6,background:'var(--ink)',opacity:0,animation:'none'}})]);
      case 'pop': return swatch(sakura);
      case 'petal': return h('div',{style:box}, Array.from({length:5},(_,i)=>h('div',{key:i,className:'spx',style:{position:'absolute',left:14,top:14,width:16,height:16,animation:'none'},dangerouslySetInnerHTML:{__html:petal}})));
      case 'score': return h('div',{style:box},h('div',{className:'spx num',style:{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',color:'var(--accent)',fontSize:22,animation:'none'}},'+120'));
      case 'fall': return h('div',{style:{width:44,height:44,overflow:'hidden',position:'relative'}},h('div',{className:'spx',style:{position:'absolute',left:6,top:6,width:32,height:32,animation:'none'},dangerouslySetInnerHTML:{__html:sakura}}));
      case 'land': return swatch(sakura,{transformOrigin:'center bottom'});
      case 'shake': case 'hitstop': return swatch(sakura);
      case 'sway': return swatch(sakura,{transformOrigin:'center bottom'});
      case 'rain': return h('div',{style:{width:44,height:44,overflow:'hidden',position:'relative'}},Array.from({length:3},(_,i)=>h('div',{key:i,className:'spx',style:{position:'absolute',left:6+i*13,top:0,width:12,height:12,animation:'none'},dangerouslySetInnerHTML:{__html:petal}})));
      case 'tele': return h('div',{style:box},h('div',{className:'spx',style:{position:'absolute',inset:3,border:'2px dashed var(--ai)',borderRadius:6,animation:'none'}}));
      case 'frost': return h('div',{style:box},[h('div',{key:1,style:{width:44,height:44},dangerouslySetInnerHTML:{__html:sakura}}),h('div',{key:2,style:{position:'absolute',inset:0,background:'rgba(244,239,227,.2)',borderRadius:6}}),h('div',{key:3,className:'spx',style:{position:'absolute',top:0,right:0,width:22,height:22,animation:'none'},dangerouslySetInnerHTML:{__html:frost}})]);
      case 'light': return h('div',{style:box},h('div',{className:'spx',style:{position:'absolute',inset:0,borderRadius:'50%',background:'radial-gradient(circle,rgba(232,217,168,.9),transparent 70%)',animation:'none'}}));
      case 'unroll': case 'unrollEvt': return h('div',{style:{width:44,height:44,overflow:'hidden'}},h('div',{className:'spx',style:{width:44,height:44,transformOrigin:'top center',background:'var(--cell)',border:'1px solid var(--line)',borderRadius:4,animation:'none'}}));
      case 'slide': return h('div',{style:{width:44,height:44,overflow:'hidden'}},h('div',{className:'spx',style:{width:44,height:44,background:'var(--cell)',border:'1px solid var(--line)',borderRadius:6,animation:'none'}}));
      case 'enter': return swatch(sakura,{transformOrigin:'center bottom'});
      case 'speak': return h('div',{style:box},h('div',{className:'spx',style:{width:44,height:44,transformOrigin:'center bottom',animation:'none'},dangerouslySetInnerHTML:{__html:sakura}}));
      case 'breath': return h('div',{style:box},h('div',{className:'spx',style:{width:'70%',height:'92%',margin:'8% auto 0',transformOrigin:'center bottom',background:'var(--cell)',border:'2px dashed var(--line)',borderRadius:'46% 46% 8px 8px',animation:'none'}}));
      case 'count': return h('div',{style:box},h('div',{className:'spx num',style:{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',color:'var(--accent)',fontSize:22,animation:'none'}},'＋8'));
      case 'lantern': return h('div',{style:box},h('div',{className:'spx',style:{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',width:18,height:26,borderRadius:'50%',background:'#d97742',border:'2px solid #2b2620',animation:'none'}}));
      default: return null;
    }
  }
  animFor(kind){ const oc='cubic-bezier(.34,1.56,.64,1)'; const m={flash:'hana-flash .4s ease',pop:'hana-pop .5s '+oc+' forwards',petal:'hana-petal .8s ease-out forwards',score:'hana-score .9s ease-out forwards',fall:'hana-pop-none',land:'hana-land .5s ease-out',shake:'hana-shake .4s ease',hitstop:'hana-hitstop .35s ease',sway:'hana-sway 1.6s ease-in-out',rain:'hana-rain 1.6s linear forwards',tele:'hana-tele 1.1s ease-in-out 2',frost:'hana-frost-grow .6s ease-out forwards',light:'hana-defeat-light 1.6s ease-out',unroll:'hana-unroll .6s '+oc,unrollEvt:'hana-unroll-evt .6s '+oc,slide:'hana-slidein .4s ease-out',enter:'hana-enter .4s '+oc,speak:'hana-speak .3s '+oc,breath:'hana-breath 2s ease-in-out',count:'hana-count .6s '+oc,lantern:'hana-lantern 1.6s ease-in-out'}; return m[kind]||''; }
  fallAnim(node){ const t=node.querySelector('.spx'); if(!t)return; t.style.transition='none'; t.style.transform='translateY(-40px)'; void t.offsetWidth; t.style.transition='transform .4s cubic-bezier(.34,1.56,.64,1)'; t.style.transform='translateY(6px)'; }

  section(title,sub,rows){
    return h('div',{style:{padding:'26px 30px'}},[
      h('div',{key:'h',style:{marginBottom:16}},[
        h('div',{key:'t',className:'mincho',style:{fontSize:22,color:'var(--ink)'}},title),
        sub&&h('div',{key:'s',style:{fontSize:12.5,color:'var(--sub)',marginTop:4}},sub)
      ]),
      h('div',{key:'tbl',style:{display:'flex',flexDirection:'column',border:'1px solid var(--line)',borderRadius:12,overflow:'hidden'}},[
        h('div',{key:'head',style:{display:'grid',gridTemplateColumns:'minmax(150px,1.5fr) 2.4fr .9fr 1.1fr 1.3fr 64px',gap:0,background:'var(--cell)',fontSize:10.5,color:'var(--sub)',letterSpacing:'.06em',fontWeight:700}},
          ['要素','keyframes / 内容','duration','delay','easing','見本'].map((c,i)=>h('div',{key:i,style:{padding:'9px 12px',borderRight: i<5?'1px solid var(--line)':'none'}},c))),
        ...rows.map((r,i)=>this.row(r,i))
      ])
    ]);
  }
  row(r,i){
    const cell=(txt,mono,extra)=>h('div',{style:{padding:'11px 12px',borderRight:'1px solid var(--line)',fontSize:12,color:'var(--ink)',lineHeight:1.55,...(extra||{})},className:mono?'mono':''},txt);
    return h('div',{key:i,style:{display:'grid',gridTemplateColumns:'minmax(150px,1.5fr) 2.4fr .9fr 1.1fr 1.3fr 64px',borderTop:'1px solid var(--line)',background: i%2?'transparent':'rgba(0,0,0,.04)'}},[
      h('div',{key:'a',style:{padding:'11px 12px',borderRight:'1px solid var(--line)',fontSize:12.5,color:'var(--ink)',fontWeight:600}},r.el),
      cell([h('div',{key:'k',className:'mono',style:{fontSize:11,color:'var(--accent)',marginBottom:3}},r.kf),h('div',{key:'d',style:{fontSize:11.5,color:'var(--sub)'}},r.desc)],false),
      cell(r.dur,true,{fontSize:11,color:'var(--sub)'}),
      cell(r.delay,false,{fontSize:11,color:'var(--sub)'}),
      cell(r.ease,true,{fontSize:10.5,color:'var(--sub)'}),
      h('div',{key:'s',style:{padding:'8px',display:'flex',alignItems:'center',justifyContent:'center'}}, r.sample? this.sampleBtn(r.sample) : h('span',{style:{color:'var(--line)',fontSize:11}},'—'))
    ]);
  }
  sampleBtn(kind){
    return h('button',{onClick:(e)=>{ const box=e.currentTarget; if(kind==='fall'){ this.fallAnim(box); return;} const anim=this.animFor(kind); box.querySelectorAll('.spx').forEach(t=>{ t.style.animation='none'; void t.offsetWidth; t.style.animation=anim; }); },
      title:'再生', style:{width:48,height:48,border:'1px solid var(--line)',borderRadius:9,background:'var(--cell)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',padding:2,position:'relative'}}, this.sampleEl(kind));
  }

  noteBlock(title,icon,children){ return h('div',{style:{padding:'18px 20px',background:'var(--cell)',border:'1px solid var(--line)',borderRadius:12,marginBottom:14}},[
    h('div',{key:'t',style:{display:'flex',alignItems:'center',gap:8,marginBottom:10}},[h('i',{key:'i',className:'ti '+icon,style:{color:'var(--accent)',fontSize:18}}),h('span',{key:'x',className:'mincho',style:{fontSize:16,color:'var(--ink)'}},title)]),
    children ]); }

  body(){
    return h('div',null,[
      // header
      h('div',{key:'hd',style:{padding:'34px 30px 24px',borderBottom:'1px solid var(--line)',background:'linear-gradient(180deg, rgba(201,160,78,.06), transparent)'}},[
        h('div',{key:'t',className:'mincho',style:{fontSize:30,color:'var(--ink)',letterSpacing:'.04em'}},'モーション仕様書'),
        h('div',{key:'s',style:{fontSize:13,color:'var(--sub)',marginTop:6,lineHeight:1.7}},'「花常」①コアゲーム・②メタ画面・④イベント画面の全アニメーション定義。実装は Vue3 + CSS で、transform / opacity のみ（60fps要件・filter:blur禁止）。見本の升目をクリックすると各アニメを1回再生します。'),
        h('div',{key:'e',style:{fontSize:12,color:'var(--sub)',marginTop:10,padding:'8px 12px',border:'1px solid var(--line)',borderRadius:8,display:'inline-block'}},[h('span',{key:1,style:{color:'var(--accent)'}},'基調 easing：'),h('span',{key:2,className:'mono',style:{marginLeft:6}},'cubic-bezier(.34,1.56,.64,1)'),h('span',{key:3},' — オーバーシュート系')])
      ]),
      this.section('一．基本演出','消す瞬間だけ華やぐ。静かなトーンを崩さない範囲で。',BASIC),
      this.section('二．ボス戦「季節の障り」','代表：十二月・大霜。ボスは天候であり、人型は描かない。',BOSS),
      this.section('三．イベント演出「花常」','④イベント画面（入舟夜市）。本編より少しだけ賑やか、祭りのチラシにはしない。差し色は灯り色1色のみ。',EVENT),
      // common + sound + mobile + reduced
      h('div',{key:'cm',style:{padding:'26px 30px'}},[
        h('div',{key:'h',className:'mincho',style:{fontSize:22,color:'var(--ink)',marginBottom:16}},'四．共通・実装メモ'),
        this.noteBlock('画面遷移の実演箇所','ti-book-upload',h('div',{style:{fontSize:12.5,color:'var(--sub)',lineHeight:1.8}},['②メタ画面の ',h('b',{key:1,style:{color:'var(--ink)'}},'「月選択マップ → 盤面（プレビュー）」'),' で、絵巻物をめくる／引く遷移（',h('span',{key:2,className:'mono',style:{color:'var(--accent)'}},'hana-unroll'),'）を再生します。マップ画面で現在地（三月）の札を選ぶと発火。上部パネルのシーン切替は開発用の直接ジャンプ（トランジションなし）で、作中遷移とは区別しています。'])),
        this.noteBlock('音のタイミング（実装は Web Audio でプロシージャル生成）','ti-music',h('div',{style:{display:'flex',flexDirection:'column',gap:8}}, SOUND.map((s,i)=>h('div',{key:i,style:{display:'flex',gap:12,fontSize:12.5,lineHeight:1.6}},[h('span',{key:1,style:{width:150,flexShrink:0,color:'var(--ink)',fontWeight:600}},s[0]),h('span',{key:2,style:{color:'var(--sub)'}},s[1])])))),
        this.noteBlock('モバイル（390px）で削減した HUD 項目','ti-device-mobile',h('div',{style:{fontSize:12.5,color:'var(--sub)',lineHeight:1.8}},['盤面が縦画面で窮屈にならないことを最優先。①コアゲームのモバイル HUD では次を削減しました：',h('ul',{key:1,style:{margin:'8px 0 0',paddingLeft:20}},[h('li',{key:1},['「',h('b',{key:'b',style:{color:'var(--ink)'}},'スコア'),'」表示（プレイ中は非表示、リザルトで提示）']),h('li',{key:2},['目標の「',h('b',{key:'b',style:{color:'var(--ink)'}},'目標'),'」ラベル文字（花アイコン＋達成数「24 / 30」は残す）']),h('li',{key:3},'月の異名（「水草生月」）を省き、月名のみ表示')])])),
        this.noteBlock('「動きOFF」（prefers-reduced-motion 相当）','ti-player-pause',h('div',{style:{fontSize:12.5,color:'var(--sub)',lineHeight:1.8}},'全アニメーションを停止し、各演出は最終状態のみを表示。落下・消滅は瞬間的に結果へ遷移。季節外れの花の常時揺れ・淡光も停止（識別は形と枠線で担保）。上部パネルの「動きOFF」で全画面に適用。')),
        this.noteBlock('マッチ非成立時の差し戻し','ti-arrow-back-up',h('div',{style:{fontSize:12.5,color:'var(--sub)',lineHeight:1.8}},['隣接ピースを入れ替えてマッチが成立しない場合：入れ替えアニメ（',h('span',{key:1,className:'mono',style:{color:'var(--accent)'}},'transform 230ms'),'）の完了後、同 easing で元位置へ戻す。手数は消費しない。'])),
        this.noteBlock('権利上の設計方針','ti-shield-check',h('div',{style:{fontSize:12.5,color:'var(--sub)',lineHeight:1.8}},'既存3マッチ作品の配色・盤面の見た目・演出の組み合わせを参照せず独自に構成。花の図案は完全オリジナル（viewBox 64×64・墨2px輪郭・色と形の両方で判別／白黒でも6種を識別可能）。花札は「月と花の対応」「黒地に鮮烈な色面」の伝統概念のみ使用し、市販札の絵柄・構図は模写しない。')),
      ]),
      h('div',{key:'ft',style:{padding:'18px 30px 28px',borderTop:'1px solid var(--line)',fontSize:11,color:'var(--sub)',textAlign:'center'}},'花常（はなつね）— hataskey games ／ 基調色6色（墨・生成り・朱・藍・金・苔緑）＋各花の色。イベント差し色は灯り色1色のみ加算')
    ]);
  }

  renderVals(){ return { stageRef:this.stageRef, body:this.body(), toggleTheme:()=>this.setState(s=>({theme:s.theme==='dark'?'light':'dark'})), themeLabel: this.state.theme==='dark'?'ダーク':'ライト' }; }
}

</script>
</body>
</html>
