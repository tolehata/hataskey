<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#1a1712;font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
  .mincho{font-family:'Shippori Mincho B1',serif}
  .num{font-family:'Bebas Neue',sans-serif;font-feature-settings:"tnum";letter-spacing:.02em}
  a{color:#c9a04e}a:hover{color:#d8b878}
  @keyframes hana-pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(0);opacity:0}}
  @keyframes hana-flash{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
  @keyframes hana-land{0%{transform:scaleX(1.18) scaleY(.82)}60%{transform:scaleX(.94) scaleY(1.06)}100%{transform:scaleX(1) scaleY(1)}}
  @keyframes hana-petal{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.9)}100%{opacity:0;transform:translate(var(--px),var(--py)) rotate(var(--pr)) scale(.5)}}
  @keyframes hana-score{0%{opacity:0;transform:translateY(4px) scale(.8)}25%{opacity:1;transform:translateY(-6px) scale(1.05)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
  @keyframes hana-sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
  @keyframes hana-oosglow{0%,100%{opacity:.25}50%{opacity:.7}}
  @keyframes hana-tele{0%,100%{opacity:.15}50%{opacity:.65}}
  @keyframes hana-rain{0%{transform:translateY(-40px);opacity:0}10%{opacity:.5}100%{transform:translateY(420px);opacity:0}}
  @keyframes hana-wind{0%{transform:translateX(-60px);opacity:0}20%{opacity:.5}100%{transform:translateX(460px);opacity:0}}
  @keyframes hana-frost-grow{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes hana-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-1px)}}
  @keyframes hana-hitstop{0%{filter:brightness(1)}40%{filter:brightness(1.6)}100%{filter:brightness(1)}}
  @keyframes hana-defeat-light{0%{opacity:0;transform:scale(.6)}40%{opacity:.85}100%{opacity:0;transform:scale(1.6)}}
  @keyframes hana-fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(340px) rotate(220deg)}}
</style>
</helmet>
<div class="stage" ref="{{ stageRef }}" style="min-height:100vh;background:#1a1712;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;--bg:#2b2620;--panel:#3a332b;--ink:#f4efe3;--sub:#b0a692;--line:#4a4238;--cell:#221e19;--accent:#c9a04e;--shu:#c4383d;--ai:#2d4a73;--fw:940px;--dur:.32s">

  <div style="width:100%;max-width:1000px;background:#211d18;border:1px solid #4a4238;border-radius:12px;padding:14px 16px;color:#f4efe3;font-size:12.5px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <span class="mincho" style="font-size:15px;color:#c9a04e;letter-spacing:.06em">花常</span>
      <span style="color:#8a8172;font-size:11.5px">① コアゲーム画面</span>
      <span style="flex:1"></span>
      <span style="color:#6f675a;font-size:10.5px;letter-spacing:.04em">開発用プレビュー・パネル</span>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
      <div style="display:flex;gap:6px" role="group">
        <button class="seg" onClick="{{ d_pc }}" style="{{ b_base }}">PC 940<sc-if value="{{ isPc }}" hint-placeholder-val="{{ true }}"><span style="{{ barS }}"></span></sc-if></button>
        <button class="seg" onClick="{{ d_mb }}" style="{{ b_base }}">モバイル 390<sc-if value="{{ isMb }}" hint-placeholder-val="{{ false }}"><span style="{{ barS }}"></span></sc-if></button>
      </div>
      <div style="display:flex;gap:6px">
        <button class="seg" onClick="{{ t_lt }}" style="{{ b_base }}">ライト<sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><span style="{{ barS }}"></span></sc-if></button>
        <button class="seg" onClick="{{ t_dk }}" style="{{ b_base }}">ダーク<sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><span style="{{ barS }}"></span></sc-if></button>
      </div>
      <button class="seg" onClick="{{ toggleMotion }}" style="{{ motionBtn }}"><i class="ti ti-player-pause"></i> 動きOFF<sc-if value="{{ motionOff }}" hint-placeholder-val="{{ false }}"><span style="{{ barS }}"></span></sc-if></button>
    </div>
    <div style="height:1px;background:#3a342c;margin:12px 0"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span style="color:#6f675a;font-size:10.5px;width:52px">画面</span>
      <sc-for list="{{ scenes }}" as="s" hint-placeholder-count="7">
        <button class="seg" onClick="{{ s.go }}" style="{{ s.style }}">{{ s.label }}</button>
      </sc-for>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px">
      <span style="color:#6f675a;font-size:10.5px;width:52px">演出</span>
      <sc-for list="{{ fxlist }}" as="f" hint-placeholder-count="6">
        <button class="seg" onClick="{{ f.play }}" style="{{ fxBtn }}"><i class="ti ti-player-play-filled" style="font-size:10px"></i> {{ f.label }}</button>
      </sc-for>
    </div>
  </div>

  <div class="frame" style="width:var(--fw);max-width:100%;transition:width .3s ease">
    {{ board }}
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:900}}">
const h = React.createElement;
const KEYS = ['matsu','ume','sakura','ajisai','himawari','kiku'];
const KANNUM = ['','','二','三','四','五','六','七','八'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

class Component extends DCLogic {
  stageRef = React.createRef();
  nid = 1;
  grid = [];
  chainDepth = 0;
  state = {
    device:'pc', theme:'light', motion:true, scene:'board',
    moves:18, score:0, goalHave:24, goalNeed:30, goalType:'sakura',
    combo:0, line:'桜が咲きはじめる頃です。三つ揃えて、春を進めましょう。',
    cells:[], parts:[], selected:null, busy:false,
    boss:false, gauge:64, telegraph:[], frozen:[],
    soundOn:true, pick:[false,false,false], stars:3, ready:false,
    shakeAmt:0,
  };

  async componentDidMount(){
    const m = await import('./flowers.js');
    this.FL = m.FLOWERS; this.SP = m.SPECIALS; this.TSUBAKI = m.TSUBAKI; this.TSUBAKI_PETAL = m.TSUBAKI_PETAL;
    this.newBoard();
    this.setState({ready:true});
    this.applyVars();
  }
  componentDidUpdate(){ this.applyVars(); }

  applyVars(){
    const el=this.stageRef.current; if(!el) return;
    const d=this.state;
    const t = d.theme==='dark'
      ? {bg:'#2b2620',panel:'#3a332b',ink:'#f4efe3',sub:'#b0a692',line:'#4a4238',cell:'#211d18'}
      : {bg:'#f4efe3',panel:'#eee6d4',ink:'#2b2620',sub:'#776d5c',line:'#dccfb5',cell:'#e7dcc6'};
    for(const k in t) el.style.setProperty('--'+k, t[k]);
    el.style.setProperty('--fw', (d.device==='pc'?940:390)+'px');
    el.style.setProperty('--dur', d.motion?'.32s':'0s');
  }

  cellSize(){ return this.state.device==='pc' ? 62 : 40; }
  boardSize(){ return this.cellSize()*8; }

  newBoard(){
    const rng=mulberry32(20260319);
    const g=[];
    for(let r=0;r<8;r++){ g[r]=[]; for(let c=0;c<8;c++){
      let ch=KEYS.slice();
      if(c>=2 && g[r][c-1] && g[r][c-2] && g[r][c-1].type===g[r][c-2].type) ch=ch.filter(x=>x!==g[r][c-1].type);
      if(r>=2 && g[r-1][c] && g[r-2][c] && g[r-1][c].type===g[r-2][c].type) ch=ch.filter(x=>x!==g[r-1][c].type);
      const type=ch[Math.floor(rng()*ch.length)];
      g[r][c]={id:this.nid++, type, row:r, col:c};
    }}
    g[1][6]={id:this.nid++, type:'tanzaku', special:true, row:1, col:6};
    g[5][2]={id:this.nid++, type:'mari', special:true, row:5, col:2};
    g[3][4]={id:this.nid++, type:'tsuki', special:true, row:3, col:4};
    g[6][5].oos=true; // 季節外れの花（梅を三月盤に）
    g[6][5].type='ume';
    this.grid=g; this.syncCells();
  }
  syncCells(){ const cells=[]; for(let r=0;r<8;r++)for(let c=0;c<8;c++) if(this.grid[r][c]) cells.push(this.grid[r][c]); this.setState({cells}); }

  adjacent(a,b){ return (Math.abs(a.row-b.row)+Math.abs(a.col-b.col))===1; }

  tapCell(cell){
    if(this.state.busy) return;
    if(cell.special || this.state.scene==='clear'||this.state.scene==='fail') return;
    const sel=this.state.selected;
    if(sel==null){ this.setState({selected:cell.id}); return; }
    if(sel===cell.id){ this.setState({selected:null}); return; }
    const a=this.byId(sel), b=cell;
    if(!this.adjacent(a,b)){ this.setState({selected:cell.id}); return; }
    this.setState({selected:null});
    this.doSwap(a,b);
  }
  byId(id){ for(let r=0;r<8;r++)for(let c=0;c<8;c++) if(this.grid[r][c]&&this.grid[r][c].id===id) return this.grid[r][c]; return null; }

  swapInGrid(a,b){ const ar=a.row,ac=a.col; this.grid[ar][ac]=b; this.grid[b.row][b.col]=a; const br=b.row,bc=b.col; a.row=br;a.col=bc; b.row=ar;b.col=ac; }

  doSwap(a,b){
    this.setState({busy:true});
    this.swapInGrid(a,b); this.syncCells();
    const dur=this.state.motion?230:0;
    setTimeout(()=>{
      const matches=this.findMatches();
      if(matches.size){
        this.chainDepth=0;
        this.setState(s=>({moves:Math.max(0,s.moves-1)}));
        this.resolve(matches);
      } else {
        this.swapInGrid(a,b); this.syncCells();
        setTimeout(()=>this.setState({busy:false, line:'ならびが合いませんでした。もう一度。'}), dur+40);
      }
    }, dur+40);
  }

  findMatches(){
    const g=this.grid, S=new Set();
    const T=(r,c)=>(g[r][c]&&!g[r][c].special)?g[r][c].type:null;
    for(let r=0;r<8;r++){let run=1;for(let c=1;c<=8;c++){ if(c<8&&T(r,c)!=null&&T(r,c)===T(r,c-1))run++;else{ if(run>=3)for(let k=1;k<=run;k++)S.add(g[r][c-k].id); run=1;} }}
    for(let c=0;c<8;c++){let run=1;for(let r=1;r<=8;r++){ if(r<8&&T(r,c)!=null&&T(r,c)===T(r-1,c))run++;else{ if(run>=3)for(let k=1;k<=run;k++)S.add(g[r-k][c].id); run=1;} }}
    return S;
  }

  resolve(matchSet){
    const motion=this.state.motion;
    this.chainDepth++;
    const chain=this.chainDepth;
    const cleared=[...matchSet];
    const gained=cleared.length*40*chain;
    // score float + petals
    const parts=[]; const C=this.cellSize();
    let goalAdd=0;
    cleared.forEach(id=>{ const cell=this.byId(id); if(!cell)return; cell.phase='clearing';
      if(cell.type===this.state.goalType) goalAdd++;
      const fl=this.FL[cell.type]||{petal:''};
      const n=motion?5:0;
      for(let i=0;i<n;i++){ const ang=Math.random()*Math.PI*2; const dist=18+Math.random()*22;
        parts.push({id:this.nid++, x:cell.col*C+C/2, y:cell.row*C+C/2, svg:cell.oos?this.TSUBAKI_PETAL:fl.petal, px:Math.cos(ang)*dist, py:Math.sin(ang)*dist, pr:(Math.random()*2-1)*220, kind:'petal'}); }
    });
    const cx=cleared.length?this.byId(cleared[0]):null;
    if(cx){ parts.push({id:this.nid++, x:cx.col*C+C/2, y:cx.row*C+C/2, text:'+'+gained, kind:'score'}); }
    this.syncCells();
    this.setState(s=>({ parts:[...s.parts,...parts], score:s.score+gained, goalHave:Math.min(s.goalNeed,s.goalHave+goalAdd),
      combo: chain>=2?chain:s.combo, shakeAmt: (motion&&chain>=3)?2:0,
      line: chain>=3?'見事な連なり。':(chain===2?'よく合いました。':s.line) }));
    setTimeout(()=>this.setState(s=>({parts:s.parts.filter(p=>!parts.includes(p))})), 760);
    const popDur=motion?300:0;
    setTimeout(()=>{ this.collapse(cleared); }, popDur);
  }

  collapse(clearedIds){
    const cl=new Set(clearedIds);
    this.state.cells.forEach(c=>{ if(cl.has(c.id)) this.grid[c.row][c.col]=null; });
    const rng=Math.random;
    for(let c=0;c<8;c++){
      let write=7;
      for(let r=7;r>=0;r--){ if(this.grid[r][c]){ if(r!==write){ this.grid[write][c]=this.grid[r][c]; this.grid[write][c].row=write; this.grid[r][c]=null; } write--; } }
      let off=1;
      for(let r=write;r>=0;r--){ const nc={id:this.nid++, type:KEYS[Math.floor(rng()*6)], row:r, col:c, enter:true, off:off++}; this.grid[r][c]=nc; }
    }
    this.syncCells();
    const motion=this.state.motion;
    if(motion){
      requestAnimationFrame(()=>{ this.state.cells.forEach(c=>{ if(c.enter){c.enter=false;} }); this.forceUpdate();
        setTimeout(()=>{ this.state.cells.forEach(c=>{ c.land=true; }); this.forceUpdate();
          setTimeout(()=>{ this.state.cells.forEach(c=>{ c.land=false; }); this.afterCollapse(); }, 220);
        }, 320);
      });
    } else { this.state.cells.forEach(c=>{c.enter=false;}); this.afterCollapse(); }
  }
  afterCollapse(){
    if(this.chainDepth<2){ const m=this.findMatches(); if(m.size){ this.resolve(m); return; } }
    this.setState({busy:false, combo:0, shakeAmt:0});
  }

  // ---- 演出再生（開発用スクリプト） ----
  playFx(name){
    if(this.state.busy && name!=='hitstop' && name!=='weather' && name!=='monthclear') return;
    const motion=this.state.motion; const C=this.cellSize();
    if(name==='vanish'){ const ids=[this.grid[4][2].id,this.grid[4][3].id,this.grid[4][4].id];
      this.chainDepth=0; ids.forEach(id=>{const c=this.byId(id);}); this.setState({busy:true});
      const set=new Set(ids); this.forceVanish(ids); }
    else if(name==='chain'){ this.scriptChain(); }
    else if(name==='fall'){ this.scriptFall(); }
    else if(name==='hitstop'){ this.hitstop(); }
    else if(name==='weather'){ this.setState({scene:'boss'}); }
    else if(name==='monthclear'){ this.monthClear(); }
  }
  forceVanish(ids){
    const motion=this.state.motion, C=this.cellSize(); const parts=[];
    ids.forEach(id=>{ const cell=this.byId(id); if(!cell)return; cell.phase='clearing'; const fl=this.FL[cell.type]||{petal:''};
      for(let i=0;i<(motion?5:0);i++){ const a=Math.random()*6.28,d=18+Math.random()*22; parts.push({id:this.nid++,x:cell.col*C+C/2,y:cell.row*C+C/2,svg:fl.petal,px:Math.cos(a)*d,py:Math.sin(a)*d,pr:(Math.random()*2-1)*220,kind:'petal'}); } });
    this.syncCells(); this.setState(s=>({parts:[...s.parts,...parts]}));
    setTimeout(()=>this.setState(s=>({parts:s.parts.filter(p=>!parts.includes(p))})),760);
    setTimeout(()=>{ this.collapse(ids); },motion?300:0);
  }
  scriptChain(){ this.setState({combo:0}); this.forceVanish([this.grid[6][1].id,this.grid[6][2].id,this.grid[6][3].id]); }
  scriptFall(){ const motion=this.state.motion; const ids=[]; for(let r=0;r<8;r++) ids.push(this.grid[r][7].id); this.collapseCol(7); }
  collapseCol(c){ const motion=this.state.motion;
    for(let r=0;r<8;r++){ this.grid[r][c]=null; }
    for(let r=0;r<8;r++){ this.grid[r][c]={id:this.nid++,type:KEYS[Math.floor(Math.random()*6)],row:r,col:c,enter:true,off:8-r}; }
    this.syncCells();
    if(motion){ requestAnimationFrame(()=>{ this.state.cells.forEach(x=>{if(x.enter)x.enter=false;}); this.forceUpdate();
      setTimeout(()=>{ this.state.cells.forEach(x=>{if(x.col===c)x.land=true;}); this.forceUpdate();
        setTimeout(()=>{ this.state.cells.forEach(x=>{x.land=false;}); this.forceUpdate(); },220); },320); });
    } else { this.state.cells.forEach(x=>{x.enter=false;}); this.forceUpdate(); }
  }
  hitstop(){ const el=this.stageRef.current; if(!el||!this.state.motion) return; const f=el.querySelector('.frame'); if(!f)return; f.style.animation='none'; void f.offsetWidth; f.style.animation='hana-hitstop .28s ease'; setTimeout(()=>f.style.animation='',300); }
  monthClear(){ const motion=this.state.motion; if(!motion) return; const parts=[]; const W=this.boardSize();
    for(let i=0;i<26;i++){ parts.push({id:this.nid++, x:Math.random()*W, y:-20, svg:this.FL.sakura.petal, kind:'rain', delay:Math.random()*900}); }
    this.setState(s=>({parts:[...s.parts,...parts], line:'三月、了。桜がひとしきり舞いました。'}));
    setTimeout(()=>this.setState(s=>({parts:s.parts.filter(p=>!parts.includes(p))})),3200);
  }

  // ---- rendering ----
  pieceInner(cell,C){
    const svg = cell.special ? (this.SP[cell.type]||{}).svg : (this.FL[cell.type]||{}).svg;
    const pad = Math.round(C*0.11);
    const kids=[ h('div',{key:'s',style:{width:'100%',height:'100%'},dangerouslySetInnerHTML:{__html:svg||''}}) ];
    if(cell.oos){ kids.push(h('div',{key:'g',style:{position:'absolute',inset:-2,borderRadius:'50%',boxShadow:'0 0 10px 2px var(--accent)',animation:this.state.motion?'hana-oosglow 2.6s ease-in-out infinite':'none',opacity:.4,pointerEvents:'none'}})); }
    if(this.state.frozen.includes(cell.id)){
      kids.push(h('div',{key:'fz',style:{position:'absolute',inset:0,background:'rgba(244,239,227,.20)',borderRadius:4,pointerEvents:'none'}}));
      kids.push(h('div',{key:'fx',style:{position:'absolute',top:-2,right:-2,width:C*0.42,height:C*0.42,animation:this.state.motion?'hana-frost-grow .5s ease both':'none',pointerEvents:'none'},dangerouslySetInnerHTML:{__html:this.frostSVG()}}));
    }
    if(this.state.telegraph.includes(cell.id)){
      kids.push(h('div',{key:'tl',style:{position:'absolute',inset:1,border:'2px dashed var(--ai)',borderRadius:5,animation:this.state.motion?'hana-tele 1.1s ease-in-out infinite':'none',pointerEvents:'none'}}));
    }
    return h('div',{style:{position:'absolute',inset:pad,animation: cell.oos&&this.state.motion?'hana-sway 3.4s ease-in-out infinite':'none',transformOrigin:'center bottom'}}, kids);
  }
  frostSVG(){ return '<svg viewBox="0 0 32 32" width="100%" height="100%"><g stroke="#dfe8ef" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95">'+
    Array.from({length:6},(_,i)=>{const a=i*60*Math.PI/180;const x=16+Math.cos(a)*13,y=16+Math.sin(a)*13;const bx=16+Math.cos(a)*7,by=16+Math.sin(a)*7;const pa=a+0.5,pb=a-0.5;return `<line x1="16" y1="16" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${(bx+Math.cos(pa)*4).toFixed(1)}" y2="${(by+Math.sin(pa)*4).toFixed(1)}"/><line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${(bx+Math.cos(pb)*4).toFixed(1)}" y2="${(by+Math.sin(pb)*4).toFixed(1)}"/>`;}).join('')+'</g></svg>'; }

  renderCell(cell){
    const C=this.cellSize(); const motion=this.state.motion;
    const enterY = cell.enter ? -(C*(cell.off||1)+C*2) : 0;
    const style={ position:'absolute', width:C, height:C, left:0, top:0,
      transform:`translate(${cell.col*C}px, ${cell.row*C + enterY}px)`,
      transition: motion?`transform var(--dur,.32s) cubic-bezier(.34,1.56,.64,1)`:'none',
      cursor: cell.special?'default':'pointer', zIndex: this.state.selected===cell.id?5:1 };
    const inner=[ this.pieceInner(cell,C) ];
    if(cell.phase==='clearing'){ inner.push(h('div',{key:'fl',style:{position:'absolute',inset:2,borderRadius:6,background:'var(--ink)',animation:motion?'hana-flash .3s ease':'none',opacity:0,pointerEvents:'none'}})); }
    const wrapStyle={...style};
    if(cell.phase==='clearing'&&motion){ wrapStyle.animation='hana-pop .3s cubic-bezier(.34,1.56,.64,1) forwards'; }
    if(cell.phase==='clearing'&&!motion){ wrapStyle.opacity=0; }
    if(cell.land&&motion){ /* squash applied to inner via nested */ }
    const landWrap = h('div',{key:'lw',style:{width:'100%',height:'100%',animation: cell.land&&motion?'hana-land .22s ease':'none',transformOrigin:'center bottom'}}, inner);
    const selRing = this.state.selected===cell.id ? h('div',{key:'sr',style:{position:'absolute',inset:0,border:'2.5px solid var(--accent)',borderRadius:7,boxShadow:'0 0 0 2px rgba(201,160,78,.3)',pointerEvents:'none'}}) : null;
    return h('div',{key:cell.id, style:wrapStyle, onClick:()=>this.tapCell(cell)}, [landWrap, selRing]);
  }

  renderParts(){ const motion=this.state.motion;
    return this.state.parts.map(p=>{
      if(p.kind==='score') return h('div',{key:p.id,className:'num',style:{position:'absolute',left:p.x,top:p.y,transform:'translate(-50%,-50%)',color:'var(--accent)',fontSize:this.state.device==='pc'?26:18,textShadow:'0 1px 3px rgba(0,0,0,.5)',pointerEvents:'none',animation:motion?'hana-score .75s ease forwards':'none',zIndex:9}}, p.text);
      if(p.kind==='rain') return h('div',{key:p.id,style:{position:'absolute',left:p.x,top:0,width:this.cellSize()*0.5,height:this.cellSize()*0.5,pointerEvents:'none',animation:`hana-rain ${2.2+Math.random()}s linear ${p.delay||0}ms forwards`,zIndex:8},dangerouslySetInnerHTML:{__html:p.svg}});
      return h('div',{key:p.id,style:{position:'absolute',left:p.x,top:p.y,width:this.cellSize()*0.42,height:this.cellSize()*0.42,transform:'translate(-50%,-50%)',pointerEvents:'none',['--px']:p.px+'px',['--py']:p.py+'px',['--pr']:p.pr+'deg',animation:motion?'hana-petal .72s ease forwards':'none',zIndex:8},dangerouslySetInnerHTML:{__html:p.svg}});
    });
  }

  weatherOverlay(){ // 大霜：霜と冷気（視認性を妨げない薄さ）
    const motion=this.state.motion;
    return h('div',{key:'wx',style:{position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden',borderRadius:8},},[
      h('div',{key:'v',style:{position:'absolute',inset:0,background:'linear-gradient(180deg, rgba(90,120,150,.22), rgba(90,120,150,0) 40%)'}}),
      ...Array.from({length:8},(_,i)=>h('div',{key:i,style:{position:'absolute',top:-6,left:(i*13)+'%',width:14,height:14,opacity:.5,animation:motion?`hana-rain ${3+Math.random()*2}s linear ${Math.random()*2000}ms infinite`:'none'},dangerouslySetInnerHTML:{__html:this.frostSVG()}}))
    ]);
  }

  hud(){
    const d=this.state; const goalFl=(this.FL&&this.FL[d.goalType])||{svg:''};
    const mob=d.device==='mobile';
    const box=(label,val,extra)=>h('div',{style:{display:'flex',flexDirection:'column',gap:2,alignItems:'center',minWidth:mob?0:64}},[
      h('div',{key:'l',style:{fontSize:mob?9.5:11,color:'var(--sub)',letterSpacing:'.08em'}},label),
      h('div',{key:'v',className:'num',style:{fontSize:mob?24:30,lineHeight:1,color:'var(--ink)'}},val)
    ]);
    const items=[
      h('div',{key:'mo',style:{display:'flex',flexDirection:'column',gap:2}},[
        h('div',{key:'a',className:'mincho',style:{fontSize:mob?16:20,color:'var(--ink)',lineHeight:1}}, d.boss?'十二月 師走':'三月 弥生'),
        h('div',{key:'b',style:{fontSize:mob?9.5:11,color:'var(--sub)'}}, d.boss?'季節の障り・大霜':'水草生月')
      ]),
      box('残り手数', d.moves),
      h('div',{key:'goal',style:{display:'flex',alignItems:'center',gap:mob?6:8}},[
        h('div',{key:'i',style:{width:mob?28:36,height:mob?28:36},dangerouslySetInnerHTML:{__html:goalFl.svg}}),
        h('div',{key:'t',style:{display:'flex',flexDirection:'column',gap:2}},[
          !mob&&h('div',{key:'l',style:{fontSize:11,color:'var(--sub)',letterSpacing:'.08em'}},'目標'),
          h('div',{key:'v',className:'num',style:{fontSize:mob?22:28,lineHeight:1,color:'var(--ink)'}}, d.goalHave+' / '+d.goalNeed)
        ])
      ]),
    ];
    if(!mob) items.push(box('スコア', d.score.toLocaleString()));
    return h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,padding:mob?'0 2px':'0 6px',flexWrap:'nowrap'}}, items);
  }

  bossGauge(){ const d=this.state; const seg=12; const filled=Math.round(d.gauge/100*seg);
    return h('div',{style:{display:'flex',flexDirection:'column',gap:5,marginTop:10}},[
      h('div',{key:'l',style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--sub)'}},[h('span',{key:1,className:'mincho'},'季節ゲージ'),h('span',{key:2,className:'num',style:{color:'var(--ink)'}},d.gauge+'%')]),
      h('div',{key:'b',style:{display:'flex',gap:3,height:12}}, Array.from({length:seg},(_,i)=>h('div',{key:i,style:{flex:1,borderRadius:2,background: i<filled?'linear-gradient(180deg,#6f93b8,#2d4a73)':'var(--cell)',border:'1px solid var(--line)',transition:'background .3s'}})))
    ]);
  }

  board(){
    if(!this.state.ready) return h('div',{style:{padding:40,textAlign:'center',color:'#8a8172'}},'…');
    const d=this.state; const S=this.boardSize(); const mob=d.device==='mobile';
    const frameInner = h('div',{style:{background:'var(--panel)',borderRadius:16,border:'1px solid var(--line)',padding:mob?14:22,color:'var(--ink)',position:'relative',boxShadow:'0 18px 50px rgba(0,0,0,.35)'}},[
      this.hud(),
      d.boss && this.bossGauge(),
      // board
      h('div',{key:'bd',style:{position:'relative',width:S,height:S,margin:(mob?'12px':'16px')+' auto 0',background:'var(--cell)',borderRadius:8,boxShadow:'inset 0 2px 10px rgba(0,0,0,.35)',border:'1px solid var(--line)',animation: d.shakeAmt&&d.motion?'hana-shake .3s ease':'none'}},[
        // grid lines subtle
        h('div',{key:'g',style:{position:'absolute',inset:0,backgroundImage:`repeating-linear-gradient(to right, transparent 0 ${this.cellSize()-1}px, rgba(0,0,0,.06) ${this.cellSize()-1}px ${this.cellSize()}px),repeating-linear-gradient(to bottom, transparent 0 ${this.cellSize()-1}px, rgba(0,0,0,.06) ${this.cellSize()-1}px ${this.cellSize()}px)`,borderRadius:8,pointerEvents:'none'}}),
        ...this.state.cells.map(c=>this.renderCell(c)),
        ...this.renderParts(),
        d.boss && this.weatherOverlay(),
        d.scene==='hint' && this.hintSpot(),
      ]),
      // combo
      d.combo>=2 && h('div',{key:'cb',style:{position:'absolute',top:mob?'42%':'44%',left:'50%',transform:'translate(-50%,-50%)',pointerEvents:'none',zIndex:7}}, h('div',{className:'mincho',style:{fontSize:mob?40:56,color:'var(--shu)',textShadow:'0 2px 12px rgba(0,0,0,.4)',fontWeight:700}}, KANNUM[d.combo]+'連')),
      // character line
      this.charLine(),
      // boosters + pause
      this.boosters(),
    ]);
    return h('div',{style:{position:'relative'}},[
      frameInner,
      d.scene==='start' && this.startModal(),
      d.scene==='pause' && this.pauseModal(),
      d.scene==='clear' && this.resultClear(),
      d.scene==='fail' && this.resultFail(),
      d.scene==='boss' && d.bossDefeat && this.bossDefeat(),
    ]);
  }

  hintSpot(){ const C=this.cellSize(); const cell=this.grid[4][3]; if(!cell)return null;
    return h('div',{key:'hint',style:{position:'absolute',inset:0,pointerEvents:'none',zIndex:6,borderRadius:8,background:`radial-gradient(circle ${C*1.1}px at ${cell.col*C+C/2}px ${cell.row*C+C/2}px, rgba(0,0,0,0) 60%, rgba(20,17,12,.72) 100%)`}},[
      h('div',{key:'r',style:{position:'absolute',left:cell.col*C+C/2,top:cell.row*C+C/2,width:C*1.6,height:C*1.6,transform:'translate(-50%,-50%)',border:'2px solid var(--accent)',borderRadius:'50%',animation:this.state.motion?'hana-oosglow 2s ease-in-out infinite':'none'}}),
      h('div',{key:'t',className:'mincho',style:{position:'absolute',left:cell.col*C+C/2,top:cell.row*C+C+18,transform:'translateX(-50%)',color:'var(--ink)',fontSize:14,whiteSpace:'nowrap',textShadow:'0 1px 4px #000'}},'ここを、隣と入れ替えて。')
    ]);
  }

  charLine(){ const mob=this.state.device==='mobile';
    return h('div',{key:'cl',style:{display:'flex',alignItems:'center',gap:10,marginTop:mob?12:16,padding:mob?'8px 12px':'10px 14px',background:'var(--cell)',border:'1px solid var(--line)',borderRadius:10}},[
      h('div',{key:'av',style:{width:mob?30:36,height:mob?30:36,borderRadius:'50%',flexShrink:0,background:'linear-gradient(160deg,#3a4a6e,#2d4a73)',border:'1.5px solid var(--line)',position:'relative',overflow:'hidden'}},
        h('div',{style:{position:'absolute',bottom:0,left:'50%',transform:'translateX(-50%)',width:'70%',height:'62%',background:'#1f1a15',borderRadius:'50% 50% 0 0'}})),
      h('div',{key:'tx',style:{fontSize:mob?12:13.5,color:'var(--ink)',lineHeight:1.5}},[h('span',{key:'n',className:'mincho',style:{color:'var(--accent)',marginRight:8,fontSize:mob?12:13}},'若菜'),this.state.line])
    ]);
  }

  boosters(){ const mob=this.state.device==='mobile'; const list=[['ti-hammer','ハンマー'],['ti-arrows-exchange','入替'],['ti-arrows-shuffle','シャッフル']];
    const bs=(icon,label,i)=>h('button',{key:i,onClick:()=>this.flashBooster(i),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:mob?'8px 4px':'10px 6px',background:'var(--cell)',border:'1px solid var(--line)',borderRadius:10,color:'var(--ink)',cursor:'pointer',transition:'box-shadow .2s, transform .1s'},className:'booster b'+i},[
      h('i',{key:'i',className:'ti '+icon,style:{fontSize:mob?18:20,color:'var(--accent)'}}),
      h('span',{key:'l',style:{fontSize:mob?10:11}},label)
    ]);
    return h('div',{key:'bo',style:{display:'flex',gap:mob?8:10,marginTop:mob?10:14,alignItems:'stretch'}},[
      ...list.map((x,i)=>bs(x[0],x[1],i)),
      h('button',{key:'p',onClick:()=>this.setState({scene:'pause'}),style:{width:mob?46:54,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--cell)',border:'1px solid var(--line)',borderRadius:10,color:'var(--ink)',cursor:'pointer'}}, h('i',{className:'ti ti-player-pause',style:{fontSize:mob?18:20}}))
    ]);
  }
  flashBooster(i){ const el=this.stageRef.current; if(!el)return; const b=el.querySelector('.b'+i); if(!b)return; b.style.boxShadow='0 0 0 2px var(--accent), 0 0 16px 2px rgba(201,160,78,.6)'; b.style.transform='translateY(-2px)'; setTimeout(()=>{b.style.boxShadow='';b.style.transform='';},260); }

  overlay(children,dim){ return h('div',{key:'ov',style:{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:dim||'rgba(20,17,12,.66)',borderRadius:16,zIndex:20,padding:16}}, children); }
  modalCard(children,w){ return h('div',{style:{width:w||360,maxWidth:'100%',background:'var(--panel)',border:'1px solid var(--line)',borderRadius:16,padding:24,color:'var(--ink)',boxShadow:'0 20px 60px rgba(0,0,0,.5)'}}, children); }
  btn(label,primary,onClick,key){ return h('button',{key,onClick,style:{padding:'12px 18px',borderRadius:10,border: primary?'none':'1px solid var(--line)',background: primary?'var(--shu)':'transparent',color: primary?'#f4efe3':'var(--ink)',fontSize:14,cursor:'pointer',fontFamily:"'Zen Kaku Gothic New',sans-serif",width:'100%',fontWeight:primary?700:500,transition:'transform .1s',minHeight:46},className:'hbtn'}, label); }

  startModal(){ const d=this.state; const goalFl=(this.FL&&this.FL[d.goalType])||{svg:''};
    return this.overlay(this.modalCard([
      h('div',{key:'m',className:'mincho',style:{textAlign:'center',fontSize:26,color:'var(--ink)'}},'三月 弥生'),
      h('div',{key:'s',style:{textAlign:'center',fontSize:12,color:'var(--sub)',marginTop:2}},'水草生月'),
      h('div',{key:'g',style:{display:'flex',alignItems:'center',justifyContent:'center',gap:10,margin:'18px 0',padding:'12px',background:'var(--cell)',borderRadius:10,border:'1px solid var(--line)'}},[
        h('div',{key:'i',style:{width:40,height:40},dangerouslySetInnerHTML:{__html:goalFl.svg}}),
        h('div',{key:'t'},[h('div',{key:'a',style:{fontSize:11,color:'var(--sub)'}},'今回の目標'),h('div',{key:'b'},[h('span',{className:'mincho',style:{fontSize:15}},'桜を '),h('span',{className:'num',style:{fontSize:22,color:'var(--accent)'}},'30'),h('span',{className:'mincho',style:{fontSize:15}},' 揃える')])])
      ]),
      h('div',{key:'bl',style:{fontSize:12,color:'var(--sub)',marginBottom:8}},'持ち込むブースター（任意）'),
      h('div',{key:'bp',style:{display:'flex',gap:8,marginBottom:20}}, [['ti-hammer','ハンマー'],['ti-arrows-exchange','入替'],['ti-arrows-shuffle','シャッフル']].map((x,i)=>
        h('button',{key:i,onClick:()=>this.setState(s=>{const p=[...s.pick];p[i]=!p[i];return{pick:p};}),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,padding:'10px 4px',borderRadius:10,cursor:'pointer',background: d.pick[i]?'rgba(201,160,78,.18)':'var(--cell)',border:'1px solid '+(d.pick[i]?'var(--accent)':'var(--line)'),color:'var(--ink)'}},[
          h('i',{key:'i',className:'ti '+x[0],style:{fontSize:19,color:'var(--accent)'}}),h('span',{key:'l',style:{fontSize:10.5}},x[1])
        ]))),
      this.btn('はじめる',true,()=>this.setState({scene:'board'}),'go')
    ],380),'rgba(20,17,12,.55)'); }

  pauseModal(){ const d=this.state;
    return this.overlay(this.modalCard([
      h('div',{key:'t',className:'mincho',style:{textAlign:'center',fontSize:22,marginBottom:18}},'一休み'),
      h('div',{key:'g',style:{display:'flex',flexDirection:'column',gap:10}},[
        this.btn('再開',true,()=>this.setState({scene:'board'}),'r'),
        this.btn('最初から',false,()=>this.setState({scene:'start'}),'a'),
        h('div',{key:'sw',style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',border:'1px solid var(--line)',borderRadius:10}},[
          h('span',{key:'l',style:{fontSize:14}},'効果音'),
          h('button',{key:'b',onClick:()=>this.setState(s=>({soundOn:!s.soundOn})),style:{width:52,height:28,borderRadius:14,border:'none',cursor:'pointer',background: d.soundOn?'var(--moss,#5a7a52)':'var(--line)',position:'relative',transition:'background .2s'}}, h('span',{style:{position:'absolute',top:3,left: d.soundOn?27:3,width:22,height:22,borderRadius:'50%',background:'#f4efe3',transition:'left .2s'}}))
        ]),
        this.btn('マップへ戻る',false,()=>this.setState({scene:'board'}),'m')
      ])
    ],340)); }

  stars(n){ return h('div',{style:{display:'flex',gap:8,justifyContent:'center'}}, [0,1,2].map(i=>h('i',{key:i,className: i<n?'ti ti-flower-filled':'ti ti-flower',style:{fontSize:38,color: i<n?'var(--accent)':'var(--line)',filter: i<n?'drop-shadow(0 2px 6px rgba(201,160,78,.5))':'none'}}))); }

  resultClear(){ const d=this.state;
    return this.overlay(this.modalCard([
      h('div',{key:'t',className:'mincho',style:{textAlign:'center',fontSize:24,color:'var(--ink)'}},'三月、了'),
      h('div',{key:'s',style:{margin:'16px 0'}}, this.stars(d.stars)),
      h('div',{key:'sc',style:{textAlign:'center',marginBottom:6}},[h('div',{key:'l',style:{fontSize:11,color:'var(--sub)'}},'スコア'),h('div',{key:'v',className:'num',style:{fontSize:40,color:'var(--accent)',lineHeight:1}}, (12480).toLocaleString())]),
      h('div',{key:'go',style:{textAlign:'center',fontSize:13,color:'var(--sub)',marginBottom:20}},'目標 桜 30／30 達成'),
      h('div',{key:'b',style:{display:'flex',flexDirection:'column',gap:10}},[
        this.btn([h('i',{key:'i',className:'ti ti-writing',style:{marginRight:8}}),'結果を書き記す'],false,()=>this.flashShare(),'sh'),
        this.btn('次へ',true,()=>this.setState({scene:'board'}),'nx')
      ])
    ],360)); }
  flashShare(){ this.setState({line:'旗鯖に書き記しました（共有はここだけ）。'}); }

  resultFail(){ 
    return this.overlay(this.modalCard([
      h('div',{key:'t',className:'mincho',style:{textAlign:'center',fontSize:22,color:'var(--ink)',lineHeight:1.5}},'手が、尽きました'),
      h('div',{key:'s',style:{textAlign:'center',fontSize:13,color:'var(--sub)',margin:'14px 0 24px',lineHeight:1.7}},'また、明日でも。\n花は逃げません。'),
      h('div',{key:'b',style:{display:'flex',flexDirection:'column',gap:10}},[
        this.btn('もう一度',true,()=>this.setState({scene:'start'}),'r'),
        this.btn('マップへ',false,()=>this.setState({scene:'board'}),'m')
      ])
    ],340)); }

  bossDefeat(){
    return this.overlay(h('div',{style:{textAlign:'center',position:'relative'}},[
      this.state.motion&&h('div',{key:'lt',style:{position:'absolute',left:'50%',top:'50%',width:300,height:300,transform:'translate(-50%,-50%)',borderRadius:'50%',background:'radial-gradient(circle,rgba(232,217,168,.7),transparent 70%)',animation:'hana-defeat-light 2.4s ease infinite',pointerEvents:'none'}}),
      ...(this.state.motion?Array.from({length:16},(_,i)=>h('div',{key:'p'+i,style:{position:'absolute',left:(Math.random()*100)+'%',top:-20,width:26,height:26,animation:`hana-rain ${2.4+Math.random()*1.5}s linear ${Math.random()*1500}ms infinite`,pointerEvents:'none'},dangerouslySetInnerHTML:{__html:this.TSUBAKI_PETAL}})):[]),
      this.modalCard([
        h('div',{key:'t',className:'mincho',style:{fontSize:15,color:'var(--sub)'}},'季節の障り・大霜'),
        h('div',{key:'t2',className:'mincho',style:{fontSize:30,color:'var(--ink)',margin:'6px 0 4px'}},'霜、解けて'),
        h('div',{key:'fl',style:{width:64,height:64,margin:'14px auto'},dangerouslySetInnerHTML:{__html:this.TSUBAKI||''}}),
        h('div',{key:'s',style:{fontSize:13,color:'var(--sub)',marginBottom:6}},'椿がひとひら、ふたひら'),
        h('div',{key:'sc',className:'num',style:{fontSize:38,color:'var(--accent)',lineHeight:1}}, (24800).toLocaleString()),
        h('div',{key:'b',style:{marginTop:20}}, this.btn('次へ',true,()=>this.setState({bossDefeat:false,scene:'board',boss:false}),'nx'))
      ],360)
    ]),'rgba(20,17,12,.82)'); }

  renderVals(){
    const d=this.state;
    const seg=(active)=>({padding:'7px 12px',borderRadius:8,border:'1px solid '+(active?'#c9a04e':'#4a4238'),background:active?'rgba(201,160,78,.16)':'#2b2620',color:active?'#f4efe3':'#b0a692',fontSize:12,cursor:'pointer',position:'relative',fontFamily:"'Zen Kaku Gothic New',sans-serif"});
    const sceneDefs=[['board','盤面'],['start','開始前'],['pause','ポーズ'],['clear','クリア'],['fail','失敗'],['hint','初回ヒント'],['boss','ボス戦']];
    const fxDefs=[['vanish','消滅'],['chain','連鎖三回'],['fall','落下'],['hitstop','ヒットストップ'],['weather','天候'],['monthclear','月クリア']];
    return {
      stageRef:this.stageRef,
      board:this.board(),
      b_base:'padding:7px 12px;border-radius:8px;border:1px solid #4a4238;background:#2b2620;color:#cfc6b4;font-size:12px;cursor:pointer;position:relative;font-family:inherit',
      barS:'position:absolute;left:8px;right:8px;bottom:3px;height:2px;background:#c9a04e;border-radius:2px',
      motionBtn: (d.motion?'padding:7px 12px;border-radius:8px;border:1px solid #4a4238;background:#2b2620;color:#cfc6b4;':'padding:7px 12px;border-radius:8px;border:1px solid #c9a04e;background:rgba(201,160,78,.16);color:#f4efe3;')+'font-size:12px;cursor:pointer;position:relative;font-family:inherit',
      fxBtn:'padding:6px 11px;border-radius:8px;border:1px solid #4a4238;background:#241f1a;color:#cfc6b4;font-size:11.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px',
      isPc:d.device==='pc', isMb:d.device==='mobile', isLight:d.theme==='light', isDark:d.theme==='dark', motionOff:!d.motion,
      d_pc:()=>this.setState({device:'pc'}), d_mb:()=>this.setState({device:'mobile'}),
      t_lt:()=>this.setState({theme:'light'}), t_dk:()=>this.setState({theme:'dark'}),
      toggleMotion:()=>this.setState(s=>({motion:!s.motion})),
      scenes:sceneDefs.map(([k,l])=>({label:l,style:seg(d.scene===k),go:()=>{ if(k==='board'){this.newBoard();} this.setState({scene:k, boss:k==='boss', bossDefeat:false, telegraph: k==='boss'?[this.grid[2][3].id,this.grid[3][3].id]:[], frozen: k==='boss'?[this.grid[1][1].id,this.grid[2][1].id,this.grid[5][6].id]:[]}); }})),
      fxlist:fxDefs.map(([k,l])=>({label:l,play:()=>this.playFx(k)})),
    };
  }
}

</script>
</body>
</html>
