packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/icons-subsetter
  - packages/sw
  - packages/cherrypick-js
  - packages/cherrypick-js/generator
  - packages/misskey-reversi
  - packages/misskey-bubble-game
# 旗鯖fork: pnpm 11 では onlyBuiltDependencies(配列)は廃止され、
# allowBuilds(パッケージ名 -> true/false のマップ)に統一された。
# 旧 onlyBuiltDependencies に列挙していたものは true として引き継ぎ、
# upstream 2026.7.0 の allowBuilds を突き合わせて exifreader/protobufjs の
# 明示的 false、および @sentry/node-cpu-profiler(profiling-node 更新に伴う
# ビルド依存の新名称)の true を追加した。
allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/profiling-node': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  argon2: true
  bufferutil: true
  canvas: true
  core-js: true
  cypress: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  nice-napi: true
  re2: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
  exifreader: false
  protobufjs: false
ignorePatchFailures: false
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - happy-dom # セキュリティ修正のため一時的に。そのうち消すこと
  - undici@6.28.1 || 7.29.1 # 上流2026.9.0のセキュリティ修正
overrides:
  '@aiscript-dev/aiscript-languageserver': '-'
  'undici@^7': 7.29.1
  'undici@^6': 6.28.1
  '@tabler/icons-webfont>sharp': '-'
  # Misskey 本家で採用済みのセキュリティ修正版を、脆弱な版だけに限定して固定する。
  '@babel/runtime@7.23.4': 7.26.10
  '@isaacs/brace-expansion@5.0.0': 5.0.1
  'bn.js@4.12.0': 4.12.3
  'brace-expansion@2.0.1': 2.1.0
  'cookie@0.6.0': 0.7.2
  'diff@5.2.0': 5.2.2
  'fast-json-stringify@6.0.0': 6.4.0
  'fastify@5.8.5': 5.10.0
  'fast-uri@3.0.1': 3.1.2
  'glob@10.4.5': 10.5.0
  'immutable@5.0.3': 5.1.5
  'lodash@4.17.21': 4.18.1
  'mdast-util-to-hast@13.2.0': 13.2.1
  'minimatch@5.1.2': 5.1.9
  'minimatch@9.0.4': 9.0.9
  'minimatch@10.0.3': 10.2.5
  'picomatch@2.3.1': 2.3.2
  'picomatch@4.0.2': 4.0.5
  'postcss@<=8.5.22': 8.5.23
  'svgo@4.0.0': 4.0.2
  'tar@7.5.16': 7.5.21
ignoredBuiltDependencies:
  - '@sentry-internal/node-cpu-profiler'
# 旗鯖fork: pnpm 11 のデフォルト(true)だと aiscript-vscode(github:)配下の
# exotic subdep である @aiscript-dev/aiscript-languageserver の解決時点で
# ERR_PNPM_EXOTIC_SUBDEP になり override(-)が効く前に installが落ちる。
# 当該依存は override で除去する対象であり、トップレベルでも github: 依存を
# 既に許容している方針と矛盾しないため無効化した。G3申し送り事項。
blockExoticSubdeps: false
