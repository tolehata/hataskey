<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>UI S · ノートの公開範囲</title>
  <link rel="stylesheet" href="styles.css">
  <script src="mock.js" defer></script>
</head>
<body data-theme="dark" data-device="desktop">
  <a class="skip-link" href="#timeline">タイムラインへ</a>
  <header class="mock-toolbar" aria-label="モックの表示設定">
    <div class="mock-title"><strong>UI S</strong><span>公開範囲 · MOCK</span></div>
    <div class="toolbar-controls">
      <fieldset><legend>タイムライン</legend><div class="segmented" id="timeline-controls">
        <button type="button" data-timeline="home" aria-pressed="true">ホーム</button>
        <button type="button" data-timeline="social" aria-pressed="false">ソーシャル</button>
        <button type="button" data-timeline="local" aria-pressed="false">ローカル</button>
        <button type="button" data-timeline="global" aria-pressed="false">グローバル</button>
      </div></fieldset>
      <fieldset><legend>画面</legend><div class="segmented" id="device-controls">
        <button type="button" data-device="desktop" aria-pressed="true">デスクトップ</button>
        <button type="button" data-device="phone" aria-pressed="false">スマホ</button>
      </div></fieldset>
      <fieldset><legend>テーマ</legend><div class="segmented" id="theme-controls">
        <button type="button" data-theme="dark" aria-pressed="true">ピンク・ダーク</button>
        <button type="button" data-theme="light" aria-pressed="false">ライト</button>
      </div></fieldset>
    </div>
  </header>
  <main class="preview" id="preview" aria-label="UI S タイムラインのモック">
    <header class="app-header"><span class="brand">Hataskey <small>UI S</small></span><span class="account"><span class="mini-avatar">凪</span><span>@nagi</span></span></header>
    <div class="app-layout">
    <nav class="side-nav" aria-label="コンパクトナビゲーション">
      <button type="button" data-side="home" aria-label="ホームを表示" title="ホーム"></button>
      <button type="button" data-side="social" aria-label="ソーシャルを表示" title="ソーシャル"></button>
      <button type="button" data-side="compose" aria-label="ノートを書く" title="ノートを書く"></button>
    </nav>
    <div class="workspace">
    <nav class="timeline-nav" aria-label="タイムライン切り替え" id="timeline-nav"></nav>
    <div class="timeline-tools"><span id="timeline-label">ホーム</span><button type="button" id="live-toggle" aria-pressed="true"><span class="live-dot" aria-hidden="true"></span>LIVE</button></div>
    <section id="timeline" tabindex="-1" aria-label="ホームのノート"></section>
    <form class="composer" id="composer">
      <div class="reply-context" id="reply-context" hidden><span id="reply-label"></span><button type="button" id="cancel-reply" aria-label="返信を取り消す">×</button></div>
      <label class="sr-only" for="draft">ノートを書く</label>
      <textarea id="draft" rows="2" maxlength="500" placeholder="いま、なにしてる？"></textarea>
      <div class="composer-row">
        <button type="button" class="icon-button" id="emoji-button" aria-label="絵文字を挿入"></button>
        <label class="composer-visibility"><span class="sr-only">投稿の公開範囲</span><select id="draft-visibility"><option value="public">パブリック</option><option value="home">ホーム</option><option value="followers">フォロワー</option><option value="specified">指定</option></select></label>
        <button type="button" class="federation-toggle" id="draft-federation" aria-pressed="false">連合あり</button>
        <button type="submit" class="send" id="send" aria-label="投稿をプレビューする" disabled></button>
      </div>
    </form>
    </div>
    </div>
  </main>
  <p class="mock-caption" id="scope-caption">ホーム／ソーシャル：アバター下に連合・公開範囲のアイコンを表示</p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <noscript><p class="mock-caption">このモックの表示と操作にはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
