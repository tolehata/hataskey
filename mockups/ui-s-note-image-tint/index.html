<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>UI S · 画像の余韻</title>
  <link rel="stylesheet" href="styles.css">
  <script src="mock.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#timeline">タイムラインへ</a>
  <header class="toolbar">
    <div class="mock-title"><strong>UI S</strong><span>画像の余韻 <small>MOCK</small></span></div>
    <div class="themes" role="group" aria-label="テーマ">
      <button type="button" data-theme="dark" aria-pressed="true">ダーク</button>
      <button type="button" data-theme="light" aria-pressed="false">ライト</button>
    </div>
  </header>
  <main class="shell">
    <header class="app-header"><span class="brand">Hataskey <small>UI S</small></span><span class="account"><span class="mini-avatar">凪</span>@nagi</span></header>
    <div class="layout">
      <aside class="settings" aria-labelledby="settings-title">
        <div class="setting-title"><span class="eyebrow">NOTE / IMAGE</span><h1 id="settings-title">画像の余韻</h1></div>
        <div class="setting-row"><label for="tint-enabled">ノート背景に色を映す</label><input type="checkbox" id="tint-enabled" checked></div>
        <div class="strength-label"><label for="strength">色の強さ</label><output id="strength-value" for="strength">40%</output></div>
        <input type="range" id="strength" min="0" max="40" step="1" value="40">
        <fieldset class="samples"><legend>最初のノートの画像</legend><div id="sample-buttons"></div></fieldset>
        <button class="choose-image" type="button" id="choose-image">＋ 画像を選ぶ</button>
        <input class="sr-only" type="file" id="local-file" accept="image/png,image/jpeg,image/webp" tabindex="-1" aria-label="ローカル画像を選ぶ">
        <p class="privacy">画像はこの端末内で処理し、外部へ送信しません。</p>
        <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true">海・夕景・森の画像で見比べられます。</p>
        <div class="palette" aria-label="最初のノートの画像の縁から抽出した色"><span>縁の色</span><div id="swatches"></div></div>
      </aside>
      <aside class="side-nav" aria-label="ナビゲーションの配置見本">
        <span role="img" aria-label="ホーム" class="current"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9"/></svg></span>
        <span role="img" aria-label="通知"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span>
        <span role="img" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></span>
        <span role="img" class="nav-compose" aria-label="ノートを書く"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20H4v-8L15 1l8 8-11 11M13 3l8 8"/></svg></span>
      </aside>
      <section class="workspace" aria-labelledby="timeline-title">
        <div class="timeline-header"><h2 id="timeline-title">ホーム</h2><span class="live"><i></i>LIVE <small>見本</small></span></div>
        <div id="timeline" tabindex="-1" aria-label="見本のタイムライン"></div>
        <div class="timeline-end">ここまで読んだ</div>
      </section>
    </div>
  </main>
  <noscript><p class="noscript">このモックはJavaScriptを有効にして開いてください。</p></noscript>
</body>
</html>
