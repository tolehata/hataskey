<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>UI S · 投稿フォーム内の確認</title>
  <link rel="stylesheet" href="styles.css">
  <script src="mock.js" defer></script>
</head>
<body data-theme="dark" data-device="desktop" data-position="bottom" data-motion="on">
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m8 12 5-5a4 4 0 0 1 6 6l-8 8a6 6 0 0 1-8-8l9-9"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2 3 4 3s3-1 4-3M8 9h.01M16 9h.01"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9Z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 4 18 8-18 8 3-7 8-1-8-1z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 17 11-11 3 3L7 20l-4 1zM13 8l3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 8h14l-3-3m3 3-3 3M20 16H6l3-3m-3 3 3 3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
  </svg>

  <a class="skip-link" href="#timeline">タイムラインへ</a>
  <header class="review-bar" aria-label="モック表示設定">
    <div class="review-name"><b>UI S</b><span>フォーム内の確認 <small>MOCK</small></span></div>
    <div class="review-controls">
      <div class="switch-set" aria-label="画面"><button type="button" data-set-device="desktop" aria-pressed="true">PC</button><button type="button" data-set-device="mobile" aria-pressed="false">モバイル</button></div>
      <div class="switch-set position-switch" aria-label="PCの投稿欄位置"><button type="button" data-set-position="top" aria-pressed="false">上</button><button type="button" data-set-position="bottom" aria-pressed="true">下</button></div>
      <div class="switch-set" aria-label="テーマ"><button type="button" data-set-theme="dark" aria-pressed="true">ダーク</button><button type="button" data-set-theme="light" aria-pressed="false">ライト</button></div>
      <button class="motion-switch" type="button" id="motion-toggle" aria-pressed="true">動き ON</button>
    </div>
  </header>

  <main class="preview" id="preview" aria-label="UI S の操作モック">
    <div class="app-top"><span class="brand">Hataskey <small>UI S</small></span><span class="account"><span class="avatar avatar-me">花</span>@hana</span></div>
    <div class="app-main">
      <nav class="side-rail" aria-label="サイドナビゲーション"><span class="rail-active"><svg><use href="#i-house"/></svg></span><span><svg><use href="#i-bell"/></svg></span><span><svg><use href="#i-grid"/></svg></span></nav>
      <div class="workspace">
        <div class="feed-head"><strong>ホーム</strong><span>タイムライン</span></div>
        <section class="timeline" id="timeline" tabindex="-1" aria-label="ホームのノート">
          <article class="note" data-note="delete">
            <span class="avatar avatar-hana">花</span><div class="note-main"><div class="note-head"><b>花</b><span>@hana · 5分前</span></div><p>帰り道の空がきれいだった。少し遠回りして帰ろう。</p><div class="note-actions"><button type="button" data-confirm="delete" aria-label="花のノートを削除"><svg><use href="#i-trash"/></svg>削除</button><button type="button" data-confirm="delete-edit" aria-label="花のノートを削除して編集"><svg><use href="#i-edit"/></svg>削除して編集</button></div></div>
          </article>
          <article class="note" data-note="unrenote">
            <span class="avatar avatar-ritsu">律</span><div class="note-main"><div class="renote-label"><svg><use href="#i-repeat"/></svg>花がリノートしました</div><div class="note-head"><b>律</b><span>@ritsu · 18分前</span></div><p>週末の喫茶店、窓際の席が空いていた。</p><div class="note-actions"><button type="button" data-confirm="unrenote" aria-label="律のノートのリノートを解除"><svg><use href="#i-repeat"/></svg>リノート解除</button></div></div>
          </article>
          <article class="note ambient-note"><span class="avatar avatar-sora">空</span><div class="note-main"><div class="note-head"><b>空</b><span>@sora · 32分前</span></div><p>雨の音を聞きながら、次の旅のことを考えている。</p><div class="note-foot">♡　 ↪　 ◇</div></div></article>
        </section>

        <section class="composer" id="composer" aria-label="投稿フォーム">
          <div class="composer-body" id="composer-body">
            <div class="composer-view draft-view" id="draft-view">
              <label class="sr-only" for="draft">ノートを書く</label><textarea id="draft" rows="1" placeholder="いま、なにしてる？">窓辺でひと息。午後の光がちょうどいい。</textarea>
              <div class="composer-tools"><button type="button" class="tool" aria-label="ツール（モック）"><svg><use href="#i-grid"/></svg></button><button type="button" class="tool" aria-label="添付（モック）"><svg><use href="#i-paperclip"/></svg></button><button type="button" class="tool" aria-label="絵文字（モック）"><svg><use href="#i-smile"/></svg></button><span class="tool-spacer"></span><span class="scope"><svg><use href="#i-globe"/></svg><span>パブリック</span></span><span class="count" id="draft-count">0</span><button type="button" class="send" id="mock-send" aria-label="投稿はモックです"><svg><use href="#i-send"/></svg></button></div>
            </div>
            <div class="composer-view confirm-view" id="confirm-view" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="target-name target-handle target-excerpt" aria-hidden="true" inert>
              <div class="confirm-heading"><span class="confirm-mark"><svg id="confirm-icon"><use href="#i-trash"/></svg></span><div><span class="eyebrow">確認</span><h1 id="confirm-title">ノートを削除しますか？</h1></div></div>
              <div class="target-note"><span class="avatar" id="target-avatar">花</span><div><div class="target-author"><b id="target-name">花</b><span id="target-handle">@hana</span></div><p id="target-excerpt">帰り道の空がきれいだった。</p></div></div>
              <div class="confirm-actions"><button type="button" class="cancel" id="cancel-confirm" title="キャンセル" aria-label="キャンセル"><svg aria-hidden="true"><use href="#i-close"/></svg></button><button type="button" class="danger" id="commit-confirm" title="削除する" aria-label="削除する"><svg aria-hidden="true"><use href="#i-trash"/></svg></button></div>
            </div>
          </div>
          <nav class="mobile-nav" aria-label="モバイルナビゲーション"><span><svg><use href="#i-grid"/></svg></span><span class="selected"><svg><use href="#i-house"/></svg></span><span><svg><use href="#i-bell"/></svg></span><span><svg><use href="#i-smile"/></svg></span></nav>
        </section>
      </div>
      <aside class="right-pane"><b>見つける</b><p>今日の話題</p><span># いつもの景色</span><span># 週末の予定</span></aside>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <noscript><p class="noscript">操作には JavaScript が必要です。</p></noscript>
</body>
</html>
